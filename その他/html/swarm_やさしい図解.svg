<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" font-family="-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7b8794"/></marker>
<filter id="s" x="-6%" y="-6%" width="112%" height="118%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2a3340" flood-opacity="0.12"/></filter>
</defs>
<rect width="1000" height="1120" fill="#f5f5f5"/>

<!-- header -->
<text x="40" y="62" font-size="32" font-weight="800" fill="#26303c">「スワーム」ってなに？</text>
<text x="42" y="96" font-size="17" fill="#5b6573">AIたちが<tspan font-weight="700" fill="#1f7a3d">チーム</tspan>になって、ひとつの仕事を進めるしくみ ― はじめての人向け</text>
<rect x="42" y="110" width="150" height="5" rx="2.5" fill="#1f7a3d"/>

<!-- ===== ① 2つの役 ===== -->
<text x="40" y="158" font-size="16" font-weight="800" fill="#9aa3b0">① 登場するのは2人</text>

<rect x="40" y="174" width="450" height="120" rx="16" fill="#fff" stroke="#cfe0f5" filter="url(#s)"/>
<text x="78" y="232" font-size="46">🧠</text>
<text x="146" y="214" font-size="21" font-weight="800" fill="#1f5fb0">考える人（リーダー）</text>
<text x="146" y="244" font-size="14.5" fill="#3a4453">仕事の段取りを決め、できあがりを</text>
<text x="146" y="266" font-size="14.5" fill="#3a4453"><tspan font-weight="800" fill="#1f5fb0">チェック</tspan>する係。<tspan font-weight="800">自分では作業しない。</tspan></text>

<rect x="510" y="174" width="450" height="120" rx="16" fill="#fff" stroke="#ddd1f3" filter="url(#s)"/>
<text x="548" y="232" font-size="46">🛠️</text>
<text x="616" y="214" font-size="21" font-weight="800" fill="#6b46c1">作る人（職人）</text>
<text x="616" y="244" font-size="14.5" fill="#3a4453">調べる・書く・まとめる、といった</text>
<text x="616" y="266" font-size="14.5" fill="#3a4453"><tspan font-weight="800" fill="#6b46c1">実際の作業</tspan>をする係。何人にも増やせる。</text>

<text x="500" y="324" font-size="14.5" fill="#5b6573" text-anchor="middle">リーダーが「これお願い」と<tspan font-weight="700" fill="#6b46c1">たのみ</tspan>、職人が<tspan font-weight="700" fill="#6b46c1">仕上げて返す</tspan>。リーダーは考える・確かめるのが仕事。</text>

<!-- ===== ② ぐるぐるループ ===== -->
<text x="40" y="372" font-size="16" font-weight="800" fill="#9aa3b0">② リーダーは「目を覚ますたび」に、こう動く（ぐるぐる回る）</text>
<rect x="40" y="388" width="920" height="470" rx="18" fill="#fff" stroke="#e4e8ee" filter="url(#s)"/>

<!-- step 1 -->
<rect x="70" y="420" width="400" height="92" rx="14" fill="#eef3fa" stroke="#cfe0f5"/>
<circle cx="108" cy="466" r="22" fill="#1f5fb0"/><text x="108" y="474" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="146" y="456" font-size="17" font-weight="800" fill="#1f5fb0">まわりを見て、やることを決める</text>
<text x="146" y="482" font-size="13.5" fill="#3a4453">「今どういう状況？ 何をすべき？ 次はいつ</text>
<text x="146" y="500" font-size="13.5" fill="#3a4453">見直す？」を、決まった時間割でなく<tspan font-weight="800">その場で判断</tspan>。</text>

<!-- step 2 -->
<rect x="530" y="420" width="400" height="92" rx="14" fill="#f3eefb" stroke="#ddd1f3"/>
<circle cx="568" cy="466" r="22" fill="#6b46c1"/><text x="568" y="474" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="606" y="456" font-size="17" font-weight="800" fill="#6b46c1">職人に仕事をたのむ</text>
<text x="606" y="482" font-size="13.5" fill="#3a4453">作業は全部、職人にお願いする。</text>
<text x="606" y="500" font-size="13.5" fill="#3a4453">いそぐ時は<tspan font-weight="800">何人にも分けて同時に</tspan>。</text>

<!-- step 3 -->
<rect x="70" y="534" width="400" height="92" rx="14" fill="#eef7f0" stroke="#bfe3cd"/>
<circle cx="108" cy="580" r="22" fill="#1f7a3d"/><text x="108" y="588" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="146" y="570" font-size="17" font-weight="800" fill="#1f7a3d">べつの人がチェックする</text>
<text x="146" y="596" font-size="13.5" fill="#3a4453">作った本人ではなく<tspan font-weight="800">別の係</tspan>が確かめる。</text>
<text x="146" y="614" font-size="13.5" fill="#3a4453">＝「自分の宿題を自分で丸つけしない」。</text>

<!-- step 4 -->
<rect x="530" y="534" width="400" height="92" rx="14" fill="#fff6ec" stroke="#f2d8b6"/>
<circle cx="568" cy="580" r="22" fill="#c0691b"/><text x="568" y="588" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="606" y="570" font-size="17" font-weight="800" fill="#c0691b">まちがいは直す</text>
<text x="606" y="596" font-size="13.5" fill="#3a4453">見つかったら直して、また別の人が確認。</text>
<text x="606" y="614" font-size="13.5" fill="#3a4453">何度やってもダメなら<tspan font-weight="800">人間に相談</tspan>。</text>

<!-- step 5 -->
<rect x="300" y="648" width="400" height="92" rx="14" fill="#fdeceb" stroke="#eebcb7"/>
<circle cx="338" cy="694" r="22" fill="#c0392b"/><text x="338" y="702" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="376" y="684" font-size="17" font-weight="800" fill="#c0392b">やることが無くなったら、自分でおわる</text>
<text x="376" y="710" font-size="13.5" fill="#3a4453">仕事が全部できて確認も済んだら、</text>
<text x="376" y="728" font-size="13.5" fill="#3a4453"><tspan font-weight="800">だらだら続けず</tspan>ループを止める。</text>

<!-- loop arrows -->
<line x1="470" y1="466" x2="528" y2="466" stroke="#7b8794" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M730,466 L760,466 L760,580 L470,580" fill="none" stroke="#7b8794" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="470" y1="580" x2="528" y2="580" stroke="#7b8794" stroke-width="2.5" marker-end="url(#a)"/>
<text x="788" y="700" font-size="14" fill="#7b8794" text-anchor="middle">まだ仕事が</text>
<text x="788" y="720" font-size="14" fill="#7b8794" text-anchor="middle">あれば…</text>
<path d="M700,694 C770,694 800,660 760,500 L760,490" fill="none" stroke="#7b8794" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<path d="M250,580 C140,580 140,694 296,694" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="120" y="640" font-size="13" fill="#c0392b" text-anchor="middle">直して</text><text x="120" y="657" font-size="13" fill="#c0392b" text-anchor="middle">もう一度</text>
<line x1="500" y1="740" x2="500" y2="772" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="430" y="776" width="140" height="40" rx="12" fill="#fdeceb" stroke="#c0392b"/>
<text x="500" y="802" font-size="15" font-weight="800" fill="#c0392b" text-anchor="middle">🛑 おわり</text>

<!-- ===== ③ 安心の約束 ===== -->
<text x="40" y="900" font-size="16" font-weight="800" fill="#9aa3b0">③ こわれないための「4つの約束」（勝手に破れないようにできている）</text>

<g font-size="14.5">
<rect x="40" y="916" width="222" height="86" rx="13" fill="#26303c"/>
<text x="151" y="950" font-size="26" text-anchor="middle">🧠✋</text>
<text x="151" y="980" fill="#fff" font-weight="700" text-anchor="middle">考える人は</text>
<text x="151" y="1000" fill="#cdd6e2" text-anchor="middle" font-size="12.5">手を動かさない</text>

<rect x="274" y="916" width="222" height="86" rx="13" fill="#26303c"/>
<text x="385" y="950" font-size="26" text-anchor="middle">✅👀</text>
<text x="385" y="980" fill="#fff" font-weight="700" text-anchor="middle">自分の答えを</text>
<text x="385" y="1000" fill="#cdd6e2" text-anchor="middle" font-size="12.5">自分で採点しない</text>

<rect x="508" y="916" width="222" height="86" rx="13" fill="#26303c"/>
<text x="619" y="950" font-size="26" text-anchor="middle">💬≠📢</text>
<text x="619" y="980" fill="#fff" font-weight="700" text-anchor="middle">メッセージは"お知らせ"</text>
<text x="619" y="1000" fill="#cdd6e2" text-anchor="middle" font-size="12.5">命令や許可ではない</text>

<rect x="742" y="916" width="218" height="86" rx="13" fill="#7a1d1a"/>
<text x="851" y="950" font-size="26" text-anchor="middle">📏🤝</text>
<text x="851" y="980" fill="#fff" font-weight="700" text-anchor="middle">合格ラインを下げる時は</text>
<text x="851" y="1000" fill="#f0c9c5" text-anchor="middle" font-size="12.5">必ず人間の承認</text>
</g>

<line x1="40" y1="1042" x2="960" y2="1042" stroke="#e4e8ee"/>
<text x="500" y="1072" font-size="14.5" fill="#5b6573" text-anchor="middle">ひとことで言うと ―</text>
<text x="500" y="1098" font-size="16" font-weight="800" fill="#26303c" text-anchor="middle">「リーダーが状況を見て段取りし、職人が作り、別の人が確かめ、終わったら自分で止まる」AIのチーム作業。</text>
</svg>
