<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>移転価格税制の本質 — コンサルティングデッキ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700;900&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap');
:root{
  --ink:#1A1D26;--blue:#1B3A6B;--blue2:#0D2240;--blue3:#2C5FA1;--blue4:#4A7FC7;
  --g1:#F7F8FA;--g2:#E8EBF0;--g3:#D1D5DE;--g4:#9BA3B5;--g5:#6B7489;--g6:#4A5168;
  --red:#C23B3B;--grn:#2E7D5B;--gold:#B8860B;--amber:#A86500;
  --serif:'Source Serif 4',Georgia,serif;--sans:'Noto Sans JP','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--g1);color:var(--ink);-webkit-font-smoothing:antialiased}
.s{width:1280px;min-height:720px;margin:40px auto;background:#fff;position:relative;overflow:hidden;box-shadow:0 2px 40px rgba(0,0,0,.08)}
.s-head{padding:14px 28px 0;border-bottom:1px solid var(--g2)}
.s-num{font-size:9px;color:var(--g4);letter-spacing:2.4px;text-transform:uppercase;margin-bottom:4px}
.s-title{font-family:var(--serif);font-size:23px;font-weight:700;color:var(--blue2);letter-spacing:-.5px;margin-bottom:2px}
.s-sub{font-size:10px;color:var(--g5);margin-bottom:7px;line-height:1.38}
.s-body{padding:8px 28px 16px}
.s-foot{position:absolute;bottom:0;left:0;right:0;padding:5px 28px;display:flex;justify-content:space-between;font-size:7px;color:var(--g4);border-top:.5px solid var(--g2)}
.cover{display:flex;flex-direction:column;justify-content:center;padding:60px 76px;background:linear-gradient(135deg,var(--blue2),var(--blue)60%,var(--blue3));color:#fff;min-height:720px}
.cover-line{width:50px;height:2px;background:var(--gold);margin-bottom:20px}
.cover-tag{font-size:11px;font-weight:500;letter-spacing:3px;color:rgba(255,255,255,.55);margin-bottom:12px}
.cover h1{font-family:var(--serif);font-size:43px;font-weight:900;line-height:1.12;letter-spacing:-1px}
.cover h2{font-family:var(--serif);font-size:20px;font-weight:600;color:rgba(255,255,255,.72);margin-bottom:28px}
.cover-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--blue4),var(--gold))}
.km{background:var(--blue2);color:#fff;padding:8px 12px;font-size:10.5px;line-height:1.44;margin-bottom:6px;border-left:4px solid var(--gold)}
.km b{color:var(--gold)}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.c4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sl{font-size:8px;font-weight:700;color:var(--blue);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid var(--blue);display:inline-block}
.t{width:100%;border-collapse:collapse;font-size:9.4px}
.t th{background:var(--blue2);color:#fff;padding:6px 7px;font-weight:600;font-size:8px;text-align:left;letter-spacing:.4px;line-height:1.25}
.t td{padding:5px 7px;border-bottom:.5px solid var(--g2);vertical-align:top;line-height:1.34}
.t tr:nth-child(even) td{background:var(--g1)}
.t .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.t .hi td{background:rgba(27,58,107,.1);font-weight:700;color:var(--blue)}
.kpi{display:flex;gap:6px;margin-bottom:8px}
.kpi>div{flex:1;border:1px solid var(--g2);padding:9px 10px;text-align:center}
.kpi-l{font-size:7px;font-weight:600;color:var(--g4);letter-spacing:.9px;text-transform:uppercase;margin-bottom:3px}
.kpi-v{font-family:var(--serif);font-size:23px;font-weight:900;color:var(--blue);line-height:1}
.kpi-u{font-size:9px;font-weight:400;color:var(--g5)}
.kpi-n{font-size:7px;color:var(--g4);margin-top:2px;line-height:1.25}
.box{border:1px solid var(--g3);padding:7px 9px;margin-bottom:5px}
.box-t{font-size:9px;font-weight:700;color:var(--blue);margin-bottom:4px;line-height:1.35}
.box p{font-size:8.7px;color:var(--g6);line-height:1.42}
.box ul{padding-left:13px;margin-top:4px}
.box li{font-size:8.6px;color:var(--g6);line-height:1.35;margin-bottom:3px}
.co{border-left:3px solid var(--blue);padding:5px 8px;background:var(--g1);font-size:8.5px;color:var(--g6);line-height:1.34;margin:5px 0}
.tag{display:inline-block;font-size:8px;font-weight:700;padding:2px 6px;border-radius:2px;letter-spacing:.5px}
.tag-b{background:var(--blue);color:#fff}
.tag-r{background:var(--red);color:#fff}
.tag-g{background:var(--grn);color:#fff}
.tag-x{background:var(--g3);color:var(--ink)}
.flow{display:flex;align-items:center;gap:0;margin-bottom:7px}
.flow-s{flex:1;text-align:center;padding:8px 6px;border:1px solid var(--g3);background:#fff}
.flow-s.on{background:var(--blue);border-color:var(--blue);color:#fff}
.flow-n{font-family:var(--serif);font-size:14px;font-weight:900;color:var(--blue)}
.flow-s.on .flow-n{color:#fff}
.flow-t{font-weight:700;font-size:8px;color:var(--blue2)}
.flow-s.on .flow-t{color:#fff}
.flow-d{font-size:7px;color:var(--g5);line-height:1.25}
.flow-s.on .flow-d{color:rgba(255,255,255,.75)}
.flow-a{width:18px;flex-shrink:0;text-align:center;color:var(--blue);font-size:13px}
.bar{display:flex;flex-direction:column;gap:4px}
.bar-r{display:flex;align-items:center;gap:8px}
.bar-l{font-size:8px;font-weight:500;color:var(--g6);width:66px;text-align:right;flex-shrink:0}
.bar-tk{flex:1;height:13px;background:var(--g1);border-radius:1px;position:relative}
.bar-f{height:100%;border-radius:1px}
.bar-v{font-size:7px;font-weight:700;position:absolute;right:-28px;top:50%;transform:translateY(-50%);color:var(--g6)}
.mx{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;border:1px solid var(--g3)}
.mx>div{padding:10px;font-size:8.5px;line-height:1.34}
.mx-t{font-size:9px;font-weight:700;margin-bottom:4px}
.mx-h{display:flex;justify-content:center;gap:40%;font-size:8px;font-weight:700;color:var(--blue);margin-bottom:4px;text-align:center}
.tl{padding-left:14px;border-left:2px solid var(--blue)}
.tl-i{margin-bottom:8px;position:relative}
.tl-i::before{content:'';width:6px;height:6px;background:var(--blue);border-radius:50%;position:absolute;left:-18px;top:4px}
.tl-y{font-family:var(--serif);font-size:10px;font-weight:900;color:var(--blue)}
.tl-x{font-size:8.5px;color:var(--g6);line-height:1.35}
.p{font-size:8.8px;line-height:1.45;color:var(--g6)}
.p b{color:var(--blue2)}
.fn{font-size:6.6px;color:var(--g4);margin-top:6px;padding-top:5px;border-top:.5px solid var(--g2);line-height:1.34}
.list{padding-left:13px;margin:5px 0 0}
.list li{font-size:8.6px;color:var(--g6);line-height:1.34;margin-bottom:3px}
.mini{font-size:7.4px;color:var(--g5);line-height:1.32}
.big{font-family:var(--serif);font-size:16px;font-weight:900;color:var(--blue2);line-height:1.1}
.center{text-align:center}
.rule{height:1px;background:var(--g2);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.quote{font-family:var(--serif);font-size:14px;line-height:1.25;color:var(--blue2);font-weight:700}
.dense-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:0 0 5px}
.dense-card{border:1px solid var(--g3);padding:3px 4px;background:linear-gradient(180deg,#fff 0%,#f8f9fb 100%);min-height:28px}
.dense-h{font-size:6.6px;font-weight:700;color:var(--g4);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.dense-t{font-size:7.3px;line-height:1.22;color:var(--blue2);font-weight:600}
.dense-note{font-size:7.1px;color:var(--g5);line-height:1.25}
</style>
</head>
<body>
<div id="slides"></div>
<script>
const deckTitle = "移転価格税制の本質 — コンサルティングデッキ";
const slides = [
  {
    type: "cover",
    tag: "INTERNATIONAL TAX ADVISORY",
    title: "移転価格税制の本質",
    subtitle: "初心者向けに、なぜ必要で、何を比べ、どう守る制度かを50枚で整理",
    preparedFor: "Transfer Pricing Fundamentals",
    date: "March 28, 2026",
    practice: "Tax & International Practice"
  },
  {
    title: "エグゼクティブサマリー",
    sub: "移転価格税制は「価格そのもの」よりも「誰が何をして、どの利益を受け取るべきか」を問う制度である",
    km: "移転価格税制の核心は、<b>グループ内価格で利益の帰属先を動かせる</b>ことに対し、<b>独立した第三者ならどう価格付けしたか</b>で税務上の利益配分を引き直す点にある。初心者は、<b>1. 制度趣旨 2. 方法選択 3. 文書化 4. 二重課税対応</b>の4本柱で理解すると迷いにくい。",
    body: `
      <div class="kpi">
        <div><div class="kpi-l">関係判定の入口</div><div class="kpi-v">50<span class="kpi-u">%</span></div><div class="kpi-n">国外関連者の基本ライン</div></div>
        <div><div class="kpi-l">同時文書化</div><div class="kpi-v">50 / 3<span class="kpi-u">億</span></div><div class="kpi-n">通常取引 / 無形資産取引</div></div>
        <div><div class="kpi-l">調査時提出</div><div class="kpi-v">45 / 60<span class="kpi-u">日</span></div><div class="kpi-n">同時文書化対象 / その他</div></div>
        <div><div class="kpi-l">周辺論点</div><div class="kpi-v">2025<span class="kpi-u">-</span></div><div class="kpi-n">利益Bを巡る各国実装が開始</div></div>
      </div>
      <div class="c2">
        <div>
          <div class="sl">最初に押さえる3点</div>
          <div class="box">
            <div class="box-t">1. 目的は「価格統制」ではなく「課税所得の配分是正」</div>
            <p>移転価格税制は、企業グループ全体の利益を増減させる制度ではない。<b>同じ連結利益をどの国に配分するか</b>を、独立企業原則に沿って見直す制度である。</p>
          </div>
          <div class="box">
            <div class="box-t">2. 正解は一つの価格ではなく「最も信頼できる考え方」</div>
            <p>現実には完全に同じ第三者取引は少ない。そのため、<b>比較可能性</b>と<b>データの質</b>を踏まえて、最も適切な方法とレンジを選ぶ発想が中心になる。</p>
          </div>
          <div class="box">
            <div class="box-t">3. 実務では文書化と紛争解決までが制度の本体</div>
            <p>価格計算だけで終わらず、<b>なぜその方法を選んだか</b>をローカルファイル等で説明し、必要なら<b>MAPやAPA</b>で二重課税や将来リスクに対応する。</p>
          </div>
        </div>
        <div>
          <div class="sl">このデッキの進み方</div>
          <div class="flow">
            <div class="flow-s on"><div class="flow-n">1</div><div class="flow-t">WHY</div><div class="flow-d">なぜ必要か</div></div>
            <div class="flow-a">→</div>
            <div class="flow-s on"><div class="flow-n">2</div><div class="flow-t">RULE</div><div class="flow-d">何を比較するか</div></div>
            <div class="flow-a">→</div>
            <div class="flow-s on"><div class="flow-n">3</div><div class="flow-t">METHOD</div><div class="flow-d">どう算定するか</div></div>
            <div class="flow-a">→</div>
            <div class="flow-s on"><div class="flow-n">4</div><div class="flow-t">PROOF</div><div class="flow-d">どう守るか</div></div>
            <div class="flow-a">→</div>
            <div class="flow-s on"><div class="flow-n">5</div><div class="flow-t">RELIEF</div><div class="flow-d">争いをどう解くか</div></div>
          </div>
          <div class="box">
            <div class="box-t">初心者向けの一文要約</div>
            <p><b>「グループ内だから自由に決められる価格」を、「第三者同士ならどう決まるか」に引き戻す</b>のが移転価格税制である。値段そのものより、役割・リスク・証拠の組み合わせが重要になる。</p>
          </div>
          <div class="co">
            初学者がつまずきやすいのは「移転価格は税率差の話」とだけ捉える点である。実際には、<b>製造・販売・役務・無形資産・金融</b>ごとに論点が違い、税率差はその一部にすぎない。
          </div>
        </div>
      </div>
    `,
    fn: "出典: 租税特別措置法66条の4・66条の4の2〜66条の4の5、国税庁「移転価格ガイドブック」2017年6月、国税庁「移転価格税制に係る文書化制度（FAQ）」令和6年6月、OECD Transfer Pricing Guidelines 2022、2026年3月28日確認。"
  },
  {
    title: "全体ロードマップ",
    sub: "制度の地図を先に置くと、個別論点に入っても現在地を見失わない",
    km: "移転価格税制は、<b>制度趣旨 → 取引の切り出し → 方法選択 → 比較可能性分析 → 文書化 → 紛争解決</b>の順に理解すると一貫して見える。価格は最後に出てくる結論であり、出発点ではない。",
    body: `
      <div class="c2">
        <div>
          <div class="sl">5章構成</div>
          <div class="tl">
            <div class="tl-i"><div class="tl-y">Chapter 1</div><div class="tl-x">なぜ移転価格税制が必要か。グループ内価格が税額を動かす直感をつかむ。</div></div>
            <div class="tl-i"><div class="tl-y">Chapter 2</div><div class="tl-x">日本法の骨格。国外関連者、国外関連取引、独立企業間価格、ベストメソッドを押さえる。</div></div>
            <div class="tl-i"><div class="tl-y">Chapter 3</div><div class="tl-x">算定方法と比較可能性分析。CUP・RP・CP・TNMM・PSMの役割分担を理解する。</div></div>
            <div class="tl-i"><div class="tl-y">Chapter 4</div><div class="tl-x">取引類型別の見方。製造、販売、役務、ロイヤルティ、金融、再編、DEMPEへ広げる。</div></div>
            <div class="tl-i"><div class="tl-y">Chapter 5</div><div class="tl-x">文書化・調査・MAP・APA。計算結果をどう守り、二重課税をどう避けるかを理解する。</div></div>
          </div>
        </div>
        <div>
          <div class="sl">読者が持つべき3つの問い</div>
          <div class="box">
            <div class="box-t">Q1. その利益は、誰のどの活動で生まれたのか</div>
            <p>製造・開発・販売・意思決定・リスク管理のどこが価値創造の源泉かを確認する。価格はこの後に決まる。</p>
          </div>
          <div class="box">
            <div class="box-t">Q2. 第三者同士なら、どの根拠で価格を決めるか</div>
            <p>比較可能な価格、粗利、原価マークアップ、営業利益、利益分割など、独立企業が実際によりどころにする指標を探す。</p>
          </div>
          <div class="box">
            <div class="box-t">Q3. その説明を、税務当局に再現できるか</div>
            <p>契約書、機能分析、比較対象、財務データ、意思決定の記録までつながって初めて実務上の「守れる移転価格」になる。</p>
          </div>
          <div class="co">
            <b>価格を見る前に取引を正しく切り出す</b>ことが重要である。何が売買なのか、何が役務なのか、何が無形資産の使用なのかを誤ると、方法選択も文書化もずれていく。
          </div>
        </div>
      </div>
    `,
    fn: "出典: 国税庁「移転価格ガイドブック」2017年6月、OECD Transfer Pricing Guidelines 2022 Chapter I-III、2026年3月28日確認。"
  },
  {
    title: "なぜ移転価格税制が必要なのか",
    sub: "グループ全体の利益は同じでも、移転価格次第で各国の課税所得は大きく動く",
    km: "移転価格税制の出発点は、<b>連結利益は不変でも、グループ内価格で各社の利益配分を動かせる</b>という事実である。各国が問題にするのは、<b>自国で生まれた価値に見合う課税所得が自国に残っているか</b>である。",
    body: `
      <div class="c2">
        <div>
          <div class="sl">シンプルな例</div>
          <table class="t">
            <tr><th>項目</th><th>実際価格</th><th>独立企業間価格の仮定</th></tr>
            <tr><td>日本親会社の製造原価</td><td class="n">70</td><td class="n">70</td></tr>
            <tr><td>海外子会社への販売価格</td><td class="n">80</td><td class="n">100</td></tr>
            <tr><td>子会社の外部販売価格</td><td class="n">120</td><td class="n">120</td></tr>
            <tr><td>日本親会社の利益</td><td class="n">10</td><td class="n">30</td></tr>
            <tr><td>海外子会社の利益</td><td class="n">40</td><td class="n">20</td></tr>
            <tr class="hi"><td>連結利益合計</td><td class="n">50</td><td class="n">50</td></tr>
          </table>
          <div class="co">
            <b>グループ全体の利益は変わらない</b>が、親会社と子会社の利益配分だけが20動く。移転価格税制は、この20が自国課税ベースを不当に減らしていないかを検証する。
          </div>
        </div>
        <div>
          <div class="sl">各国が見るポイント</div>
          <div class="box">
            <div class="box-t">1. 生産・開発・販売などの実活動はどこで行われたか</div>
            <p>工場、研究開発、販売網、意思決定、在庫管理、信用判断など、価値創造に関わる活動の所在地を見る。</p>
          </div>
          <div class="box">
            <div class="box-t">2. 価格決定権とリスク管理は誰が持っていたか</div>
            <p>契約に書かれていても、実際に意思決定していなければ、その会社に大きな利益を配分しにくい。</p>
          </div>
          <div class="box">
            <div class="box-t">3. 第三者なら受け入れる条件か</div>
            <p>価格、粗利率、営業利益率、ロイヤルティ率、金利などを、独立企業間の条件と比較して妥当性を確かめる。</p>
          </div>
        </div>
      </div>
    `,
    fn: "出典: 国税庁「移転価格ガイドブック」2017年6月、OECD Transfer Pricing Guidelines 2022 Chapter I、2026年3月28日確認。"
  },
  {
    title: "国家間の視点で見ると何が問題か",
    sub: "移転価格税制は、一国の増税策ではなく、国際的な課税権配分ルールの一部である",
    km: "移転価格論点は、<b>一国の税収確保</b>と同時に、<b>二重課税を避けながら各国の課税権をどう配るか</b>の問題でもある。だからこそ、国内法だけでなく<b>租税条約・MAP・APA</b>が制度の内側に組み込まれている。",
    body: `
      <div class="c3">
        <div>
          <div class="sl">自国当局の関心</div>
          <div class="box">
            <div class="box-t">課税ベースの流出防止</div>
            <p>自国内で生まれた利益が低税率国や実体の薄い会社へ移っていないかを確認する。</p>
          </div>

const total = String(slides.length).padStart(2, "0");
const footLeft = "移転価格税制の本質 — Confidential";

function renderDenseMeta(pageNum) {
  const meta = denseMeta[pageNum];
  if (!meta) return "";
  return `
    <div class="dense-strip">
      ${meta.map(([h, t]) => `
        <div class="dense-card">
          <div class="dense-h">${h}</div>
          <div class="dense-t">${t}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderSlide(slide, idx) {
  const page = String(idx + 1).padStart(2, "0");
  const pageNum = idx + 1;
  if (slide.type === "cover") {
    return `
      <div class="s cover">
        <div class="cover-line"></div>
        <div class="cover-tag">${slide.tag}</div>
        <h1>${slide.title}</h1>
        <h2>${slide.subtitle}</h2>
        <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:rgba(255,255,255,.55)">
          <div>
            <div style="font-size:11px;color:rgba(255,255,255,.35);margin-bottom:4px">PREPARED FOR</div>
            <div style="font-size:14px;color:rgba(255,255,255,.82)">${slide.preparedFor}</div>
          </div>
          <div style="text-align:right">
            <div>${slide.date}</div>
            <div style="margin-top:2px">${slide.practice}</div>
          </div>
        </div>
        <div class="cover-bar"></div>
      </div>
    `;
  }
  return `
    <div class="s">
      <div class="s-head">
        <div class="s-num">${page} / ${total}</div>
        <div class="s-title">${slide.title}</div>
        <div class="s-sub">${slide.sub}</div>
      </div>
      <div class="s-body">
        <div class="km">${slide.km}</div>
        ${renderDenseMeta(pageNum)}
        ${slide.body}
        <div class="fn">${slide.fn}</div>
      </div>
      <div class="s-foot">
        <span>${footLeft}</span>
        <span>${page} / ${total}</span>
      </div>
    </div>
  `;
}

document.getElementById("slides").innerHTML = slides.map(renderSlide).join("");
