<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リサーチ成果物 — JPLAWDB4</title>
<meta name="description" content="条文構造マップ・解説ガイド・計算ツール。jplawdb4の法令・判例・通達データベースから派生した公開成果物のインデックス。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0071e3;--link:#0066cc;--link-dark:#2997ff;
  --black:#000;--ink:#1d1d1f;--body:rgba(0,0,0,.8);--muted:rgba(0,0,0,.48);
  --gray:#f5f5f7;--white:#fff;
  --font:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--gray)}
body{background:var(--white);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.374px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.works{flex:1}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

.nav{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.nav-in{max-width:980px;margin:0 auto;height:48px;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.nav a{color:rgba(255,255,255,.8);font-size:12px;letter-spacing:-.12px;transition:color .2s}
.nav a:hover{color:#fff;text-decoration:none}
.nav .mark{font-size:15px;font-weight:600;color:#fff}
.nav ul{display:flex;gap:34px;list-style:none}
@media(max-width:480px){.nav ul{gap:20px}.nav .gh{display:none}}

.hero{background:var(--white);text-align:center;padding:120px 22px 90px}
.hero .kicker{font-size:14px;font-weight:600;letter-spacing:-.224px;color:var(--muted);margin-bottom:14px}
.hero h1{font-size:clamp(40px,6.5vw,64px);font-weight:600;line-height:1.07;letter-spacing:-.28px;color:var(--ink)}
.hero p.sub{font-size:clamp(17px,2.4vw,23px);line-height:1.4;letter-spacing:.231px;color:var(--body);margin:22px auto 0;max-width:33em}

.works{background:var(--gray);padding:90px 22px 130px}
.works-in{max-width:980px;margin:0 auto}
.works-head{font-size:12px;font-weight:600;letter-spacing:-.12px;color:var(--muted);text-transform:uppercase;margin-bottom:22px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{display:block;background:var(--white);border-radius:12px;padding:36px 32px 30px;transition:transform .35s cubic-bezier(.25,.1,.25,1)}
.card:hover{text-decoration:none;transform:scale(1.012)}
.card .cat{font-size:12px;font-weight:600;letter-spacing:-.12px;color:var(--muted);text-transform:uppercase}
.card h3{font-size:21px;font-weight:700;line-height:1.19;letter-spacing:.231px;color:var(--ink);margin-top:10px}
.card p{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--body);margin-top:12px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:18px}
.card .date{font-size:12px;letter-spacing:-.12px;color:var(--muted)}
.card .go{font-size:14px;letter-spacing:-.224px;color:var(--link)}
.card .go::after{content:" ›"}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
.fallback{text-align:center;font-size:14px;color:var(--muted);padding:40px 0}
.fallback a{color:var(--link)}

footer{background:var(--gray);padding:0 22px 44px}
.foot-in{max-width:980px;margin:0 auto}
.foot-note{font-size:12px;line-height:1.33;letter-spacing:-.12px;color:var(--muted);padding-bottom:18px;border-bottom:1px solid #d2d2d7}
.foot-row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:18px;font-size:12px;letter-spacing:-.12px;color:var(--muted)}
.foot-row a{color:var(--muted)}
.foot-row a:hover{color:var(--ink)}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.25,.1,.25,1),transform .8s cubic-bezier(.25,.1,.25,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.card{transition:none}}
</style>
</head>
<body>

<nav class="nav"><div class="nav-in">
<a class="mark" href="../index.html">法</a>
<ul>
<li><a href="../laws/index.html">条文ライブラリ</a></li>
<li><a href="index.html">リサーチ成果物</a></li>
<li class="gh"><a href="https://github.com/jplawdb4/jplawdb4" target="_blank" rel="noopener">GitHub</a></li>
</ul>
</div></nav>

<header class="hero">
<p class="kicker reveal">Research &amp; Tools</p>
<h1 class="reveal">リサーチ成果物。</h1>
<p class="sub reveal">条文構造マップ、解説ガイド、計算ツール。すべて一次資料（e-Gov法令テキスト・通達原文）に基づいて構成。</p>
</header>

<section class="works">
<div class="works-in">
<p class="works-head" id="count">Public Works</p>
<div class="cards" id="cards"></div>
<noscript><p class="fallback">JavaScriptが無効のため一覧を表示できません。<a href="index.json">index.json</a> から直接参照してください。</p></noscript>
</div>
</section>

<footer>
<div class="foot-in">
<p class="foot-note">各成果物は一次資料に基づく機械変換・編集によるもので、個別の税務助言ではありません。正文・原文は官報・e-Gov・国税庁の各原典で確認してください。</p>
<div class="foot-row">
<span>JPLAWDB4 — Japanese Tax Law Database</span>
<span><a href="../index.html">ホーム</a>　<a href="../laws/index.html">条文ライブラリ</a>　<a href="https://github.com/jplawdb4/jplawdb4" target="_blank" rel="noopener">GitHub</a></span>
</div>
</div>
</footer>

<script>
(function(){
  function reveal(){
    var els=document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}});
    },{threshold:.1});
    els.forEach(function(e){io.observe(e)});
  }

  function cat(item){
    var id=item.id||'', t=item.title||'';
    if(id.indexOf('structure_map')>=0||t.indexOf('構造マップ')>=0) return '構造マップ';
    if(id.indexOf('calculator')>=0||t.indexOf('計算')>=0) return '計算ツール';
    if(t.indexOf('ガイド')>=0||t.indexOf('解説')>=0) return 'ガイド';
    if(t.indexOf('アトラス')>=0||t.indexOf('図解')>=0) return '図解';
    return 'リサーチ';
  }
  function fmtDate(d){
    if(!d) return '';
    var p=String(d).split('-');
    return p.length===3 ? p[0]+'年'+Number(p[1])+'月'+Number(p[2])+'日' : d;
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  fetch('index.json').then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(d){
    var items=(d.items||d).filter(function(i){return i.published!==false && i.file});
    items.sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});
    var box=document.getElementById('cards');
    box.innerHTML=items.map(function(i){
      return '<a class="card reveal" href="'+esc(i.file)+'">'
        +'<span class="cat">'+esc(cat(i))+'</span>'
        +'<h3>'+esc(i.title)+'</h3>'
        +'<p>'+esc(i.summary||'')+'</p>'
        +'<div class="row"><span class="date">'+esc(fmtDate(i.date))+'</span><span class="go">見る</span></div>'
        +'</a>';
    }).join('');
    document.getElementById('count').textContent='Public Works — '+items.length+'編';
    reveal();
  }).catch(function(){
    document.getElementById('cards').innerHTML=
      '<p class="fallback" style="grid-column:1/-1">一覧を読み込めませんでした。<a href="index.json">index.json</a> から直接参照してください。</p>';
    reveal();
  });
})();
</script>
</body>
</html>
