<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">証拠マップ</title>
  <desc id="d">確定、高確度推定、未解決 frontier を分けた証拠マップ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f6ef"/>
      <stop offset="100%" stop-color="#ebe0d0"/>
    </linearGradient>
    <style>
      .display{font:700 54px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .kicker{font:800 15px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#3158c7}
      .body{font:500 22px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#152038}
      .small{font:500 17px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#5f6773}
      .head{font:800 24px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="92" class="kicker">SECTION 02 / EVIDENCE MAP</text>
  <text x="92" y="148" class="display">証拠マップ</text>
  <text x="92" y="192" class="small">矢印を引く前に、どの根拠が何を直接固定しているかを整理する。</text>

  <line x1="532" y1="248" x2="532" y2="780" stroke="#1c2a57" stroke-opacity=".16"/>
  <line x1="1056" y1="248" x2="1056" y2="780" stroke="#1c2a57" stroke-opacity=".16"/>

  <text x="112" y="276" class="head" fill="#3158c7">固定</text>
  <text x="556" y="276" class="head" fill="#ab691d">高確度推定</text>
  <text x="1080" y="276" class="head" fill="#9b3e72">未解決 frontier</text>

  <rect x="104" y="314" width="384" height="122" rx="16" fill="#fffdf9" stroke="#3158c7" stroke-opacity=".24"/>
  <text x="132" y="356" class="body">JIF Japan Partners GP</text>
  <text x="132" y="388" class="small">→ JIF Japan Partners LP</text>
  <text x="132" y="418" class="small">FSA / SEC でかなり強く固定</text>

  <rect x="104" y="460" width="384" height="122" rx="16" fill="#fffdf9" stroke="#3158c7" stroke-opacity=".24"/>
  <text x="132" y="502" class="body">Gravity一般社団法人</text>
  <text x="132" y="534" class="small">→ Gravity合同会社</text>
  <text x="132" y="564" class="small">代表社員レイヤーとして確認</text>

  <rect x="104" y="606" width="384" height="122" rx="16" fill="#fffdf9" stroke="#3158c7" stroke-opacity=".24"/>
  <text x="132" y="648" class="body">Gravity合同会社 と AH</text>
  <text x="132" y="680" class="small">別導線であること</text>
  <text x="132" y="710" class="small">TMK route / 信託受益権 route</text>

  <rect x="548" y="314" width="460" height="122" rx="16" fill="#fffdf9" stroke="#ab691d" stroke-opacity=".28"/>
  <text x="576" y="356" class="body">Japan DH4 投資事業有限責任組合</text>
  <text x="576" y="388" class="small">→ JIF Japan Partners LP</text>
  <text x="576" y="418" class="small">比較案件と文言整合性が非常に高い</text>

  <rect x="548" y="460" width="460" height="122" rx="16" fill="#fffdf9" stroke="#ab691d" stroke-opacity=".28"/>
  <text x="576" y="502" class="body">JIF Japan Partners LP</text>
  <text x="576" y="534" class="small">→ Gravity合同会社</text>
  <text x="576" y="564" class="small">foreign sleeve から domestic operator へ入る読み筋</text>

  <rect x="548" y="606" width="460" height="122" rx="16" fill="#fffdf9" stroke="#ab691d" stroke-opacity=".28"/>
  <text x="576" y="648" class="body">Gravity合同会社</text>
  <text x="576" y="680" class="small">→ Gravity特定目的会社</text>
  <text x="576" y="710" class="small">TMK 優先出資・特定出資ルートとして最有力</text>

  <rect x="1072" y="314" width="420" height="122" rx="16" fill="#fffdf9" stroke="#9b3e72" stroke-opacity=".3"/>
  <text x="1100" y="356" class="body">ACRA Business Profile</text>
  <text x="1100" y="388" class="small">partner / member roster</text>
  <text x="1100" y="418" class="small">controlled-access gap を詰める鍵</text>

  <rect x="1072" y="460" width="420" height="122" rx="16" fill="#fffdf9" stroke="#9b3e72" stroke-opacity=".3"/>
  <text x="1100" y="502" class="body">匿名組合契約</text>
  <text x="1100" y="534" class="small">営業者・匿名組合員・分配ロジック</text>
  <text x="1100" y="564" class="small">GK / TK の具体関係を直接固定</text>

  <rect x="1072" y="606" width="420" height="122" rx="16" fill="#fffdf9" stroke="#9b3e72" stroke-opacity=".3"/>
  <text x="1100" y="648" class="body">TMK 資産流動化計画</text>
  <text x="1100" y="680" class="small">優先出資引受資料 / treaty claimant</text>
  <text x="1100" y="710" class="small">TMK route と条約主体判定を詰める</text>
</svg>
