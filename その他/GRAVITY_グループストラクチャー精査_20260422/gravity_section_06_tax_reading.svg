<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="t d">
  <title id="t">税務読解</title>
  <desc id="d">GK、TK、TMK、一般社団法人、条約主体判定を示した税務読解図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf6ef"/>
      <stop offset="100%" stop-color="#e9dece"/>
    </linearGradient>
    <style>
      .display{font:700 54px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .kicker{font:800 15px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#3158c7}
      .head{font:800 26px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .body{font:500 20px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#152038}
      .small{font:500 16px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#5f6773}
    </style>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="92" y="92" class="kicker">SECTION 06 / TAX READING</text>
  <text x="92" y="148" class="display">税務読解</text>
  <text x="92" y="192" class="small">誰が誰を持つかではなく、どのレイヤーで何が課税・分配・導管化されるかを読む。</text>

  <rect x="92" y="262" width="300" height="220" rx="20" fill="#edf2ff" stroke="#3158c7" stroke-opacity=".22"/>
  <text x="124" y="320" class="head">GK</text>
  <text x="124" y="366" class="body">Gravity合同会社</text>
  <text x="124" y="404" class="small">普通法人として出発</text>
  <text x="124" y="434" class="small">TK があるから GK 自体が</text>
  <text x="124" y="460" class="small">透明化するわけではない</text>

  <rect x="438" y="262" width="300" height="220" rx="20" fill="#fff4e7" stroke="#ab691d" stroke-opacity=".26"/>
  <text x="470" y="320" class="head">TK</text>
  <text x="470" y="366" class="body">匿名組合分配</text>
  <text x="470" y="404" class="small">源泉税・所得類型・条約</text>
  <text x="470" y="434" class="small">20.42%</text>
  <text x="470" y="460" class="small">treaty claimant の中心論点</text>

  <rect x="784" y="262" width="300" height="220" rx="20" fill="#ebf7f1" stroke="#0f7d60" stroke-opacity=".24"/>
  <text x="816" y="320" class="head">TMK</text>
  <text x="816" y="366" class="body">資産箱 / 導管課税</text>
  <text x="816" y="404" class="small">自動導管ではない</text>
  <text x="816" y="434" class="small">資産流動化法上の要件と実装</text>
  <text x="816" y="460" class="small">を見て判断</text>

  <rect x="1130" y="262" width="300" height="220" rx="20" fill="#fff0f4" stroke="#9b3e72" stroke-opacity=".28"/>
  <text x="1162" y="320" class="head">一般社団法人</text>
  <text x="1162" y="366" class="body">Gravity一般社団法人</text>
  <text x="1162" y="404" class="small">orphan / governance layer</text>
  <text x="1162" y="434" class="small">直接の収益主体というより</text>
  <text x="1162" y="460" class="small">コントロール側の箱</text>

  <rect x="232" y="566" width="1136" height="210" rx="22" fill="#fffdf9" stroke="#1c2a57" stroke-opacity=".16"/>
  <text x="268" y="624" class="head">treaty claimant frontier</text>
  <text x="268" y="674" class="body">JIF Japan Partners LP が pass-through なら、条約主体は LP 本体ではなく member-side に流れる可能性がある。</text>
  <text x="268" y="712" class="small">このため、member roster / Business Profile / treaty entitlement の実務メモが最後の重要 gap になる。</text>
  <text x="268" y="748" class="small">要するに、GK・TK・TMK・LP を一つの箱として課税判断してはいけない。</text>
</svg>
