<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="t d">
  <title id="t">層構造</title>
  <desc id="d">Ares/GLPからforeign sleeve、国内GK/TK、TMK/物流資産までを4層に分けた図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="100%" stop-color="#e8dece"/>
    </linearGradient>
    <style>
      .display{font:700 54px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .kicker{font:800 15px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#3158c7}
      .body{font:500 22px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#152038}
      .small{font:500 17px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#5f6773}
      .layer{font:800 22px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .box{fill:#fffdf9;stroke:#1c2a57;stroke-opacity:.15;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="92" y="92" class="kicker">SECTION 03 / LAYERED STRUCTURE</text>
  <text x="92" y="148" class="display">層構造</text>
  <text x="92" y="192" class="small">会社法、ファンド導線、国内オペレーター、資産箱を同一平面で混ぜないための図。</text>

  <rect x="82" y="238" width="1436" height="132" rx="18" fill="#eaf0ff" stroke="#3158c7" stroke-opacity=".2"/>
  <text x="108" y="286" class="layer">Layer 1 / Platform &amp; Management</text>
  <rect x="414" y="264" width="334" height="78" rx="14" class="box"/>
  <text x="444" y="312" class="body">Ares / GLP Platform</text>
  <rect x="786" y="264" width="320" height="78" rx="14" class="box"/>
  <text x="816" y="312" class="body">GLP Japan / Advisors</text>
  <text x="1138" y="312" class="small">sponsor / management / coordination</text>

  <rect x="82" y="396" width="1436" height="160" rx="18" fill="#fff4e7" stroke="#ab691d" stroke-opacity=".22"/>
  <text x="108" y="446" class="layer">Layer 2 / Foreign Sleeve &amp; Upper Vehicles</text>
  <rect x="332" y="430" width="336" height="92" rx="14" class="box"/>
  <text x="362" y="480" class="body">Japan DH4 投資事業有限責任組合</text>
  <text x="362" y="510" class="small">直上候補として最有力</text>
  <rect x="726" y="430" width="308" height="92" rx="14" class="box"/>
  <text x="756" y="480" class="body">JIF Japan Partners LP</text>
  <text x="756" y="510" class="small">foreign sleeve / investor vehicle</text>
  <rect x="1072" y="430" width="304" height="92" rx="14" class="box"/>
  <text x="1102" y="480" class="body">JIF Japan Partners GP</text>
  <text x="1102" y="510" class="small">業務執行組合員等</text>

  <rect x="82" y="582" width="1436" height="168" rx="18" fill="#eaf7f0" stroke="#0f7d60" stroke-opacity=".24"/>
  <text x="108" y="632" class="layer">Layer 3 / Domestic GK-TK &amp; Control</text>
  <rect x="252" y="620" width="286" height="96" rx="14" class="box"/>
  <text x="282" y="670" class="body">Gravity一般社団法人</text>
  <text x="282" y="700" class="small">orphan / control layer</text>
  <rect x="588" y="620" width="288" height="96" rx="14" class="box"/>
  <text x="618" y="670" class="body">Gravity合同会社</text>
  <text x="618" y="700" class="small">GK / TK operator 候補</text>
  <rect x="926" y="620" width="302" height="96" rx="14" class="box"/>
  <text x="956" y="670" class="body">Gravity AH合同会社</text>
  <text x="956" y="700" class="small">trust beneficiary right route</text>

  <rect x="82" y="776" width="1436" height="134" rx="18" fill="#fff0f4" stroke="#9b3e72" stroke-opacity=".22"/>
  <text x="108" y="824" class="layer">Layer 4 / Downstream Asset Boxes</text>
  <rect x="532" y="804" width="286" height="78" rx="14" class="box"/>
  <text x="562" y="852" class="body">Gravity特定目的会社</text>
  <rect x="874" y="804" width="246" height="78" rx="14" class="box"/>
  <text x="904" y="852" class="body">物流資産</text>

  <path d="M668 476 H726" stroke="#ab691d" stroke-width="5" stroke-dasharray="14 12" fill="none"/>
  <path d="M1034 476 H1072" stroke="#3158c7" stroke-width="5" fill="none"/>
  <path d="M395 716 H588" stroke="#3158c7" stroke-width="5" fill="none"/>
  <path d="M732 716 V804" stroke="#ab691d" stroke-width="5" stroke-dasharray="14 12" fill="none"/>
  <path d="M818 843 H874" stroke="#ab691d" stroke-width="5" stroke-dasharray="14 12" fill="none"/>
</svg>
