<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="t d">
  <title id="t">各プレイヤーの位置づけ</title>
  <desc id="d">主要プレイヤーを機能別に配置した図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="100%" stop-color="#e7ddcd"/>
    </linearGradient>
    <style>
      .display{font:700 54px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .kicker{font:800 15px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#3158c7}
      .head{font:800 25px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .body{font:500 20px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#152038}
      .small{font:500 16px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#5f6773}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="92" y="92" class="kicker">SECTION 05 / PLAYER ROLES</text>
  <text x="92" y="148" class="display">各プレイヤーの位置づけ</text>
  <text x="92" y="192" class="small">社名の羅列ではなく、機能ごとに切り分ける。</text>

  <line x1="332" y1="248" x2="332" y2="874" stroke="#1c2a57" stroke-opacity=".15"/>
  <line x1="800" y1="248" x2="800" y2="874" stroke="#1c2a57" stroke-opacity=".15"/>
  <line x1="1268" y1="248" x2="1268" y2="874" stroke="#1c2a57" stroke-opacity=".15"/>

