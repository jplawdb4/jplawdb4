<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="t d">
  <title id="t">比較ブランチと frontier</title>
  <desc id="d">JDP3、JDP4、Sakai、Gravity AH合同会社と未解決 frontier を分けた図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f1"/>
      <stop offset="100%" stop-color="#e7dccd"/>
    </linearGradient>
    <style>
      .display{font:700 54px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .kicker{font:800 15px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#3158c7}
      .head{font:800 25px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .body{font:500 20px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#152038}
      .small{font:500 16px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#5f6773}
    </style>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="92" y="92" class="kicker">SECTION 07 / COMPARISON &amp; FRONTIER</text>
  <text x="92" y="148" class="display">比較ブランチと未解決 frontier</text>
  <text x="92" y="192" class="small">比較対象を本線と混ぜず、次に取りに行くべき資料を明示する。</text>

  <line x1="824" y1="250" x2="824" y2="828" stroke="#1c2a57" stroke-opacity=".15"/>
  <text x="112" y="286" class="head">比較ブランチ</text>
  <text x="856" y="286" class="head">未解決 frontier</text>

  <rect x="104" y="324" width="660" height="118" rx="18" fill="#fffdf9" stroke="#9b3e72" stroke-opacity=".28"/>
  <text x="136" y="374" class="body">JDP3 / JDP4 / Sakai</text>
  <text x="136" y="406" class="small">project-specific sleeve として理解するのが自然</text>

  <rect x="104" y="484" width="660" height="118" rx="18" fill="#fffdf9" stroke="#9b3e72" stroke-opacity=".28"/>
  <text x="136" y="534" class="body">Gravity AH合同会社</text>
  <text x="136" y="566" class="small">信託受益権 route の比較対象 / 本線ではない</text>

  <rect x="104" y="644" width="660" height="118" rx="18" fill="#fffdf9" stroke="#9b3e72" stroke-opacity=".28"/>
  <text x="136" y="694" class="body">使い方</text>
  <text x="136" y="726" class="small">「同系案件の設計例」として参照し、本線の直接証拠の代わりにしない</text>

  <rect x="856" y="324" width="644" height="118" rx="18" fill="#fffdf9" stroke="#ab691d" stroke-opacity=".28"/>
  <text x="888" y="374" class="body">Business Profile</text>
  <text x="888" y="406" class="small">JIF LP / GLP JIF LP / partner roster</text>

  <rect x="856" y="484" width="644" height="118" rx="18" fill="#fffdf9" stroke="#ab691d" stroke-opacity=".28"/>
  <text x="888" y="534" class="body">匿名組合契約 / TMK 資料</text>
  <text x="888" y="566" class="small">営業者・分配ロジック・優先出資引受を直接固定</text>

  <rect x="856" y="644" width="644" height="118" rx="18" fill="#fffdf9" stroke="#ab691d" stroke-opacity=".28"/>
  <text x="888" y="694" class="body">treaty claimant memo</text>
  <text x="888" y="726" class="small">LP が pass-through の場合の member-level 判定を詰める</text>
</svg>
