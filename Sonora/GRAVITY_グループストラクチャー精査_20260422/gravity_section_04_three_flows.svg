<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="t d">
  <title id="t">法的・経済的・税務的フロー</title>
  <desc id="d">法的、経済的、税務的フローを三つのレーンで示した図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#e8dece"/>
    </linearGradient>
    <style>
      .display{font:700 54px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .kicker{font:800 15px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#3158c7}
      .body{font:500 22px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#152038}
      .small{font:500 17px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#5f6773}
      .lane{font:800 22px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .pill{fill:#fffdf9;stroke:#1c2a57;stroke-opacity:.15;stroke-width:2}
    </style>
    <marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3158c7"/>
    </marker>
    <marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f7d60"/>
    </marker>
    <marker id="arrA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ab691d"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="92" y="92" class="kicker">SECTION 04 / THREE FLOWS</text>
  <text x="92" y="148" class="display">法的・経済的・税務的フロー</text>
  <text x="92" y="192" class="small">所有、資金、課税を同じ矢印で読まないための三レーン図。</text>

  <rect x="88" y="252" width="1424" height="178" rx="18" fill="#edf2ff" stroke="#3158c7" stroke-opacity=".2"/>
  <text x="120" y="302" class="lane">法的フロー</text>
  <rect x="290" y="288" width="210" height="84" rx="14" class="pill"/><text x="338" y="340" class="body">GP</text>
  <rect x="572" y="288" width="270" height="84" rx="14" class="pill"/><text x="618" y="340" class="body">JIF Japan Partners LP</text>
  <rect x="920" y="288" width="220" height="84" rx="14" class="pill"/><text x="970" y="340" class="body">Gravity GK</text>
  <rect x="1210" y="288" width="198" height="84" rx="14" class="pill"/><text x="1262" y="340" class="body">TMK</text>
  <path d="M500 330 H572" stroke="#3158c7" stroke-width="5" fill="none" marker-end="url(#arrB)"/>
  <path d="M842 330 H920" stroke="#3158c7" stroke-width="5" fill="none" marker-end="url(#arrB)"/>
  <path d="M1140 330 H1210" stroke="#ab691d" stroke-width="5" stroke-dasharray="14 12" fill="none" marker-end="url(#arrA)"/>

  <rect x="88" y="468" width="1424" height="196" rx="18" fill="#ebf7f1" stroke="#0f7d60" stroke-opacity=".22"/>
  <text x="120" y="518" class="lane">経済フロー</text>
  <rect x="220" y="550" width="250" height="84" rx="14" class="pill"/><text x="264" y="602" class="body">LP / LPS 投資家</text>
  <rect x="530" y="550" width="280" height="84" rx="14" class="pill"/><text x="580" y="602" class="body">JIF Japan Partners LP</text>
  <rect x="880" y="550" width="230" height="84" rx="14" class="pill"/><text x="920" y="602" class="body">Gravity GK / TK</text>
  <rect x="1180" y="550" width="230" height="84" rx="14" class="pill"/><text x="1218" y="602" class="body">TMK / assets</text>
  <path d="M470 592 H530" stroke="#0f7d60" stroke-width="5" fill="none" marker-end="url(#arrG)"/>
  <path d="M810 592 H880" stroke="#0f7d60" stroke-width="5" fill="none" marker-end="url(#arrG)"/>
  <path d="M1110 592 H1180" stroke="#0f7d60" stroke-width="5" fill="none" marker-end="url(#arrG)"/>
  <text x="360" y="688" class="small">出資・コミットメント</text>
  <text x="644" y="688" class="small">foreign sleeve</text>
  <text x="952" y="688" class="small">匿名組合 / GK 投資</text>
  <text x="1244" y="688" class="small">特定出資・優先出資 / project exposure</text>

  <rect x="88" y="704" width="1424" height="184" rx="18" fill="#fff3e7" stroke="#ab691d" stroke-opacity=".22"/>
  <text x="120" y="754" class="lane">税務フロー</text>
  <rect x="238" y="792" width="236" height="70" rx="14" class="pill"/><text x="326" y="836" class="body">GK</text>
  <rect x="552" y="792" width="236" height="70" rx="14" class="pill"/><text x="641" y="836" class="body">TK</text>
  <rect x="866" y="792" width="236" height="70" rx="14" class="pill"/><text x="950" y="836" class="body">TMK</text>
  <rect x="1180" y="792" width="236" height="70" rx="14" class="pill"/><text x="1235" y="836" class="body">treaty claimant?</text>
  <text x="258" y="888" class="small">普通法人</text>
  <text x="564" y="888" class="small">20.42% / look-through?</text>
  <text x="912" y="888" class="small">導管課税の可否</text>
  <text x="1224" y="888" class="small">member-level へ流れる可能性</text>
</svg>
