<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">GRAVITYグループ全体俯瞰</title>
  <desc id="d">上流のLPSからJIF Japan Partners LP、Gravity合同会社、Gravity特定目的会社までの全体俯瞰図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="100%" stop-color="#e8dece"/>
    </linearGradient>
    <style>
      .display{font:700 54px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#1c2a57}
      .kicker{font:800 15px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#ab691d}
      .body{font:500 23px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#152038}
      .small{font:500 18px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#5f6773}
      .mini{font:600 15px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#5f6773}
      .chip{font:800 16px 'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif;fill:#3158c7}
      .box{fill:#fffdf9;stroke:#1c2a57;stroke-opacity:.15;stroke-width:2}
      .solid{stroke:#3158c7;stroke-width:5;fill:none}
      .dash{stroke:#ab691d;stroke-width:5;fill:none;stroke-dasharray:15 12}
      .dot{stroke:#9b3e72;stroke-width:4;fill:none;stroke-dasharray:4 12}
    </style>
    <marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3158c7"/>
    </marker>
    <marker id="arrA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ab691d"/>
    </marker>
    <marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#9b3e72"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="46" y="42" width="1508" height="816" rx="18" fill="none" stroke="#1c2a57" stroke-opacity=".12"/>
  <text x="92" y="92" class="kicker">SECTION 01 / OVERVIEW</text>
  <text x="92" y="148" class="display">全体俯瞰</text>
  <text x="92" y="192" class="small">current best model を一枚で固定し、確定・推定・比較対象を同じ平面上で切り分ける。</text>

  <rect x="92" y="252" width="260" height="118" rx="16" class="box"/>
  <text x="122" y="296" class="chip">高確度推定</text>
  <text x="122" y="332" class="body">Japan DH4</text>
  <text x="122" y="362" class="small">投資事業有限責任組合</text>

  <rect x="406" y="252" width="300" height="118" rx="16" class="box"/>
  <text x="436" y="296" class="chip">foreign sleeve</text>
  <text x="436" y="332" class="body">JIF Japan Partners LP</text>
  <text x="436" y="362" class="small">GP は Ares 重要子会社群で確認</text>

  <rect x="774" y="228" width="272" height="102" rx="16" class="box"/>
  <text x="804" y="270" class="chip">確定</text>
  <text x="804" y="306" class="body">JIF Japan Partners GP</text>

  <rect x="760" y="420" width="300" height="126" rx="16" class="box"/>
  <text x="790" y="464" class="chip">国内 GK / TK</text>
  <text x="790" y="500" class="body">Gravity合同会社</text>
  <text x="790" y="530" class="small">Tokumei Kumiai Operator 候補</text>

  <rect x="1114" y="420" width="286" height="126" rx="16" class="box"/>
  <text x="1144" y="464" class="chip">下流 TMK</text>
  <text x="1144" y="500" class="body">Gravity特定目的会社</text>
  <text x="1144" y="530" class="small">最有力 downstream candidate</text>

  <rect x="1114" y="612" width="286" height="110" rx="16" class="box"/>
  <text x="1144" y="656" class="chip">実物資産</text>
  <text x="1144" y="692" class="body">物流資産</text>

  <rect x="406" y="612" width="300" height="110" rx="16" class="box"/>
  <text x="436" y="656" class="chip" fill="#9b3e72">比較対象</text>
  <text x="436" y="692" class="body">Gravity AH合同会社</text>
  <text x="436" y="720" class="small">信託受益権 route</text>

  <rect x="92" y="612" width="260" height="110" rx="16" class="box"/>
  <text x="122" y="656" class="chip">control layer</text>
  <text x="122" y="692" class="body">Gravity一般社団法人</text>

  <path d="M352 311 H406" class="dash" marker-end="url(#arrA)"/>
  <path d="M706 311 H774" class="solid" marker-end="url(#arrB)"/>
  <path d="M908 330 V420" class="dash" marker-end="url(#arrA)"/>
  <path d="M352 667 H406" class="solid" marker-end="url(#arrB)"/>
  <path d="M1060 482 H1114" class="dash" marker-end="url(#arrA)"/>
  <path d="M1257 546 V612" class="dash" marker-end="url(#arrA)"/>
  <path d="M706 667 H760" class="dot" marker-end="url(#arrR)"/>

  <rect x="92" y="782" width="1410" height="48" rx="24" fill="#fffdf9" stroke="#1c2a57" stroke-opacity=".12"/>
  <text x="118" y="813" class="mini">危ない誤読: JIF Japan Partners LP = 単純な外国法人 = 直接日本資産保有主体</text>
</svg>
