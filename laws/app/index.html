<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFC条文ブラウザ（フラット版） | JPLAWDB4</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23305b73%22/><text x=%2250%22 y=%2272%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>法</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--surface:#fff;--p:#305b73;--pd:#214559;--p25:#e6edf1;--navy:#2a3a47;
--ink:#23282e;--ink2:#555c64;--ink3:#62676d;--line:#e2ddd4;--line2:#cfc9bd;--yellow:#e3cf95;--yellow50:#f3ecda;
--pink:#8a4f6b;--pink-soft:#f3e7ec;--accent:#8a4f6b;
--sans:"Noto Sans JP","Hiragino Sans",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:2.0;-webkit-font-smoothing:antialiased}
::selection{background:rgba(48,91,115,.18)}
button{font-family:var(--sans);cursor:pointer}

/* ===== topbar ===== */
.topbar{background:var(--surface);border-bottom:2px solid var(--p);position:sticky;top:0;z-index:40}
.topbar-in{width:min(100%,1500px);margin:0 auto;padding:7px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.94rem;color:var(--navy);text-decoration:none;white-space:nowrap}
.brand .mark{width:27px;height:27px;border-radius:7px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-size:.76rem;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.law-jump{display:flex;gap:4px}
.law-jump button{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:3px 10px;font-size:.74rem;font-weight:900;color:var(--navy);transition:.15s}
.law-jump button:hover{border-color:var(--p);color:var(--pd);background:var(--p25)}
.searchbox{flex:1;display:flex;position:relative;max-width:440px}
.searchbox input{width:100%;font-family:var(--sans);font-size:.84rem;border:1px solid var(--line2);border-radius:8px;padding:7px 12px 7px 32px;background:var(--bg);outline:none;transition:.2s}
.searchbox input:focus{border-color:var(--p);background:#fff}
.searchbox .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:.8rem;pointer-events:none}
.tb-btn{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:5px 11px;font-size:.76rem;font-weight:700;color:var(--navy);white-space:nowrap;transition:.2s;text-decoration:none}
.tb-btn:hover{border-color:var(--p);color:var(--pd)}
.menu-btn{display:none}

/* ===== ctlbar ===== */
.ctlbar{background:var(--p25);border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:35}
.ctlbar-in{width:min(100%,1500px);margin:0 auto;padding:5px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl-l{font-size:.7rem;font-weight:700;color:var(--pd);letter-spacing:.06em}
.kbtn{border:1px solid rgba(48,91,115,.45);background:#fff;border-radius:999px;padding:2px 12px;font-size:.72rem;font-weight:700;color:var(--pd);transition:.15s}
.kbtn:hover,.kbtn.on{background:var(--p);color:#fff;border-color:var(--p)}
.ctl-hint{margin-left:auto;font-size:.68rem;color:var(--ink3)}

/* ===== layout ===== */
.wrap{width:min(100%,1500px);margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start}
.side{position:sticky;top:84px;height:calc(100vh - 84px);overflow-y:auto;padding:12px 6px 60px 12px;border-right:1px solid var(--line);background:rgba(255,255,255,.55)}
.side details{margin:2px 0}
.side summary{cursor:pointer;list-style:none;font-size:.8rem;font-weight:900;color:#fff;padding:4px 12px;border-radius:7px;display:flex;gap:6px;align-items:baseline;line-height:1.6}
.side summary::before{content:"▸";font-size:.62rem;transition:transform .15s;flex:0 0 auto}
.side details[open]>summary::before{transform:rotate(90deg)}
.side details.l-hou summary{background:var(--navy)}
.side details.l-rei summary{background:var(--pd)}
.side details.l-kis summary{background:#2f7d52}
.side details.l-tsu summary{background:#8a6d1f}
.side .grp{font-size:.7rem;font-weight:900;color:var(--navy);background:var(--p25);border-radius:6px;padding:2px 10px;margin:7px 0 2px}
.side a{display:block;font-size:.78rem;color:var(--ink2);text-decoration:none;padding:1px 8px;border-radius:6px;line-height:1.7;cursor:pointer}
.side a:hover{background:var(--p25);color:var(--pd)}
.side a .cap{color:var(--ink3);font-size:.7rem}
.side a .star{color:var(--accent);font-size:.7rem}
.content{padding:18px 26px 50vh;min-width:0;background:var(--surface);min-height:70vh}

/* law sections */
.law-sec{margin-bottom:40px}
.law-head{position:sticky;top:84px;z-index:5;background:var(--surface);padding:8px 0 4px;border-bottom:3px solid var(--p25)}
.law-head h1{font-size:1.2rem;font-weight:900;color:var(--navy);margin:0;line-height:1.4;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.law-head .num{font-size:.72rem;color:var(--ink3);font-weight:400}
.l-tag{font-size:.7rem;font-weight:900;color:#fff;border-radius:5px;padding:1px 10px;vertical-align:3px}
.l-tag.hou{background:var(--navy)}.l-tag.rei{background:var(--pd)}.l-tag.kis{background:#2f7d52}.l-tag.tsu{background:#8a6d1f}
.rel-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.rel-chip{font-size:.68rem;font-weight:700;color:var(--accent);background:#fff;border:1px solid rgba(178,62,89,.4);border-radius:999px;padding:0 10px;text-decoration:none;transition:.15s}
.rel-chip:hover{background:var(--accent);color:#fff}
.grp-head{font-size:.82rem;font-weight:900;color:var(--navy);background:var(--p25);border-radius:7px;padding:4px 14px;margin:22px 0 8px}

.art-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 4px;padding:8px 0 6px;border-bottom:3px double var(--line2);scroll-margin-top:130px}
.art-no{font-size:1.16rem;font-weight:900;color:var(--ink)}
.art-no::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--p);margin-right:8px;vertical-align:2px}
.art-cap{font-size:.86rem;color:var(--pd);font-weight:700}
.art-tools{margin-left:auto;display:flex;gap:6px}
.art-tools button{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:27px;height:27px;font-size:.78rem;color:var(--ink3);display:flex;align-items:center;justify-content:center;transition:.15s;padding:0 7px}
.art-tools button:hover{border-color:var(--p);color:var(--pd)}
.art-tools button.on{color:var(--accent);border-color:var(--accent);background:var(--pink-soft)}

.node{display:flex;gap:9px;margin:8px 0;scroll-margin-top:130px;border-radius:8px;padding:2px 6px 2px 2px;transition:background .4s,outline-color .4s}
.node.hl{background:var(--yellow50);outline:2px solid var(--yellow)}
.node .badge{flex:0 0 auto;min-width:23px;height:23px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:7px;padding:0 4px;cursor:default}
.badge.p1{opacity:.35}
.badge.haslink{box-shadow:0 0 0 2px rgba(48,91,115,.18);cursor:pointer}
.badge.chu{background:var(--yellow50);border-color:#e2d49a;color:#8a6d1f;font-size:.62rem;opacity:1}
.node .body{font-size:.88rem;min-width:0;flex:1;text-align:justify}
.node.item{margin-left:26px}.node.item .badge{background:var(--p25);border-color:rgba(48,91,115,.3);color:var(--pd)}
.node.sub1{margin-left:56px}.node.sub1 .badge{background:var(--pink-soft);border-color:rgba(233,30,99,.25);color:var(--pink)}
.node.sub2{margin-left:86px}.node.sub2 .badge{background:var(--yellow50);border-color:#e2d49a;color:#8a6d1f}
.node.sub3{margin-left:116px}
.node-link{flex:0 0 auto;align-self:flex-start;margin-top:7px;opacity:0;font-size:.66rem;color:var(--ink3);text-decoration:none;transition:.15s;cursor:pointer}
.node:hover .node-link{opacity:1}
.node-link:hover{color:var(--pd)}

/* 括弧 */
.kakko{color:#5b6a76}
.kakko-2{color:#8a6d1f}
.kakko-3{color:#7a5ba6}
.kakko-4{color:#8a4f6b}
.kakko-5{color:#2f7d52}
.kakko,.kakko-2,.kakko-3,.kakko-4,.kakko-5{cursor:pointer;border-radius:3px;transition:background .12s}
.kakko:hover,.kakko-2:hover,.kakko-3:hover,.kakko-4:hover,.kakko-5:hover{background:rgba(48,91,115,.08)}
.kfold{display:inline-block;background:var(--p25);color:var(--pd);font-weight:700;border-radius:4px;padding:0 6px;font-size:.78em;cursor:pointer;border:1px dashed rgba(0,129,147,.4)}
.kfold:hover{background:var(--p);color:#fff}

/* 参照・定義語・委任 */
a.self{color:var(--pd);text-decoration:none;border-bottom:1.5px solid rgba(48,91,115,.55);cursor:pointer}
a.self:hover{background:var(--p25)}
a.law{color:#6a3fa0;text-decoration:none;border-bottom:1.5px dashed rgba(106,63,160,.45)}
a.law:hover{background:#f2ecfa}
a.law::after{content:"↗";font-size:.68em;vertical-align:super;margin-left:1px}
.term{border-bottom:1px dotted #98a6b0;cursor:help;border-radius:2px}
.term:hover{background:rgba(48,91,115,.1);border-bottom-color:var(--pd)}
.deleg{background:linear-gradient(transparent 62%,rgba(48,91,115,.22) 62%);cursor:pointer;border-radius:2px}
.deleg:hover{background:rgba(48,91,115,.16)}
mark.note-hl{background:linear-gradient(transparent 55%,rgba(252,228,138,.85) 55%);border-bottom:2px solid #e8c64a;cursor:pointer;border-radius:2px;padding:0}
mark.note-hl:hover{background:var(--yellow)}
.jmp{cursor:pointer}

/* 表 */
.tbl-wrap{overflow-x:auto;margin:8px 0}
.law-tbl{border-collapse:collapse;font-size:.78rem;background:#fff}
.law-tbl td{border:1px solid var(--line2);padding:5px 9px;vertical-align:top;min-width:6em}

/* 縦串 */
.bk-sec{margin:18px 0 6px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.bk-sec .bk-h{background:var(--pink-soft);color:var(--accent);font-size:.74rem;font-weight:900;padding:4px 14px;letter-spacing:.04em}
.bk-sub{font-size:.68rem;font-weight:900;padding:5px 14px 1px;letter-spacing:.04em}
.bk-sub.rei{color:var(--pd)}.bk-sub.kis{color:#2f7d52}.bk-sub.tsu{color:#8a6d1f}.bk-sub.hou{color:var(--accent)}
.bk-sec .bk-b{padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto}
.bk-sec a{font-size:.72rem;font-weight:700;color:var(--accent);background:#fff;border:1px solid rgba(178,62,89,.35);border-radius:999px;padding:1px 10px;text-decoration:none;transition:.15s;cursor:pointer}
.bk-sec a:hover{background:var(--accent);color:#fff}
.bk-sec a.lawside{color:var(--pd);border-color:rgba(0,129,147,.35)}
.bk-sec a.lawside:hover{background:var(--pd);color:#fff}
.bk-sec a.rei{color:var(--pd);border-color:rgba(0,129,147,.35)}
.bk-sec a.rei:hover{background:var(--pd);color:#fff}
.bk-sec a.kis{color:#2f7d52;border-color:rgba(47,125,82,.35)}
.bk-sec a.kis:hover{background:#2f7d52;color:#fff}
.bk-sec a.tsu{color:#8a6d1f;border-color:rgba(138,109,31,.4)}
.bk-sec a.tsu:hover{background:#8a6d1f;color:#fff}

/* メモ */
.memo{margin:14px 0;border:1px dashed var(--line2);border-radius:9px;padding:10px 14px;background:var(--yellow50)}
.memo .lbl{font-size:.66rem;font-weight:700;color:var(--ink3);letter-spacing:.14em}
.memo textarea{width:100%;min-height:52px;border:1px solid var(--line2);border-radius:7px;padding:7px 10px;font-family:var(--sans);font-size:.82rem;background:#fff;outline:none;resize:vertical}
.memo textarea:focus{border-color:var(--p)}

/* プレビュー窓 */
.pv{position:fixed;z-index:90;width:min(480px,92vw);background:#fff;border:1.5px solid var(--p);border-radius:11px;box-shadow:0 16px 44px -12px rgba(0,88,112,.45);display:flex;flex-direction:column;max-height:46vh}
.pv.pv-wide{width:min(640px,94vw);max-height:64vh}
.pv.pinned{border-color:var(--navy);box-shadow:0 20px 50px -14px rgba(0,40,60,.5)}
.pv-h{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--p25);border-radius:10px 10px 0 0;cursor:grab;user-select:none}
.pv.pinned .pv-h{background:var(--navy)}
.pv-ka{font-size:.74rem;font-weight:900;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.pinned .pv-ka{color:#fff}
.pv-h button{border:0;background:transparent;font-size:.78rem;color:var(--pd);padding:1px 4px;border-radius:4px}
.pv.pinned .pv-h button{color:#9fe2ee}
.pv-h button:hover{background:rgba(255,255,255,.5)}
.pv-b{padding:8px 14px;font-size:.8rem;line-height:1.95;overflow-y:auto;min-height:0}
.pv-b .cap{color:var(--pd);font-weight:700;font-size:.74rem}
.pv-f{display:flex;gap:6px;padding:5px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.pv-f button,.pv-f a{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:1px 10px;font-size:.7rem;font-weight:700;color:var(--navy);text-decoration:none;transition:.15s;cursor:pointer}
.pv-f button:hover,.pv-f a:hover{border-color:var(--p);color:var(--pd)}
.pv .defsrc{font-size:.7rem;color:var(--ink3);margin-top:4px}
.pv .pop-list a{display:block;font-size:.76rem;color:var(--pd);text-decoration:none;padding:2px 6px;border-radius:5px;cursor:pointer}
.pv .pop-list a:hover{background:var(--p25)}
.impl{border-top:1px dashed var(--line2);padding-top:8px;margin-top:10px}
.impl:first-child{border-top:0;margin-top:0;padding-top:0}
.impl-ka{font-size:.74rem;font-weight:900;margin-bottom:2px}
.impl-ka a{color:var(--pd);text-decoration:none;cursor:pointer}
.impl-ka a:hover{text-decoration:underline}
.impl-ka .cap{color:var(--pd);font-weight:700;font-size:.7rem;background:var(--p25);border-radius:4px;padding:0 7px;margin-left:6px}
.impl-more{font-size:.72rem;color:var(--ink3);margin-top:8px}
.impl-more a{color:var(--pd);text-decoration:none;margin-right:8px;cursor:pointer}

/* 縦串インライン */
.vx{margin:0 0 12px 33px;display:flex;flex-wrap:wrap;gap:5px;align-items:flex-start}
.vx-b{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:0 11px;font-size:.68rem;font-weight:700;color:var(--ink3);transition:.15s;line-height:1.7}
.vx-b.rei{color:var(--pd);border-color:rgba(0,129,147,.35)}
.vx-b.kis{color:#2f7d52;border-color:rgba(47,125,82,.35)}
.vx-b.tsu{color:#8a6d1f;border-color:rgba(138,109,31,.4)}
.vx-b.hou{color:var(--accent);border-color:rgba(178,62,89,.35)}
.vx-b:hover{background:var(--p25)}
.vx-b.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.vx-sec{flex-basis:100%;border-left:3px solid var(--line2);padding:6px 4px 6px 14px;margin-top:2px;border-radius:4px;background:linear-gradient(90deg,rgba(0,88,112,.035),transparent)}
.vx-sec .impl-b{font-size:.83rem}

/* 観察ノート */
#obsBtn{position:fixed;z-index:88;display:none;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:4px 14px;font-size:.76rem;font-weight:900;box-shadow:0 8px 22px -8px rgba(0,40,60,.6)}
#obsBtn:hover{background:var(--pd)}
#obsDlg{position:fixed;z-index:92;right:18px;top:96px;width:min(380px,94vw);background:#fff;border:2px solid var(--navy);border-radius:12px;box-shadow:0 24px 60px -16px rgba(0,40,60,.55);display:none;flex-direction:column;max-height:80vh}
#obsDlg .d-h{background:var(--navy);color:#fff;font-size:.78rem;font-weight:900;padding:7px 14px;border-radius:9px 9px 0 0;display:flex;justify-content:space-between;align-items:center}
#obsDlg .d-h button{border:0;background:transparent;color:#9fe2ee;font-size:.9rem;cursor:pointer}
#obsDlg .d-b{padding:10px 14px;overflow-y:auto}
#obsDlg .d-cite{font-size:.74rem;font-weight:900;color:var(--pd);background:var(--p25);border-radius:5px;padding:2px 10px;display:inline-block;margin-bottom:6px}
#obsDlg label{display:block;font-size:.66rem;font-weight:700;color:var(--ink3);letter-spacing:.1em;margin:8px 0 2px}
#obsDlg textarea,#obsDlg input{width:100%;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-family:var(--sans);font-size:.8rem;outline:none;resize:vertical}
#obsDlg textarea:focus,#obsDlg input:focus{border-color:var(--p)}
#obsDlg .d-q{background:var(--yellow50)}
#obsDlg .d-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#obsDlg .d-f button{flex:1;border-radius:7px;padding:6px;font-size:.78rem;font-weight:900;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
#obsDlg .d-f button.save{background:var(--navy);color:#fff;border-color:var(--navy)}
#obsDlg .d-f button.save:hover{background:var(--pd)}

/* オーバーレイパネル */
.panel{position:fixed;z-index:91;right:0;top:84px;bottom:0;width:min(460px,96vw);background:#fff;border-left:2px solid var(--navy);box-shadow:-16px 0 44px -16px rgba(0,40,60,.4);display:none;flex-direction:column}
.panel.open{display:flex}
.panel .p-h{background:var(--navy);color:#fff;font-size:.8rem;font-weight:900;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
.panel .p-h button{border:0;background:transparent;color:#9fe2ee;font-size:.9rem;cursor:pointer}
.panel .p-b{overflow-y:auto;padding:10px 14px;flex:1}
.res{display:block;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:8px;text-decoration:none;color:inherit;transition:.2s;position:relative;cursor:pointer}
.res:hover{border-color:var(--p);box-shadow:0 6px 18px -12px rgba(0,88,112,.3)}
.res .r-law{font-size:.66rem;font-weight:700;color:var(--pd);background:var(--p25);border-radius:4px;padding:1px 8px;margin-right:8px}
.res .r-t{font-weight:900;color:var(--navy);font-size:.84rem}
.res .r-s{font-size:.76rem;color:var(--ink2);margin-top:2px;line-height:1.8}
.res .r-q{font-size:.76rem;color:var(--ink2);border-left:3px solid var(--yellow);padding-left:9px;margin:5px 0;line-height:1.8}
.res .r-tools{display:flex;gap:5px;margin-top:5px}
.res .r-tools button{border:1px solid var(--line);background:#fff;border-radius:5px;font-size:.66rem;padding:1px 8px;color:var(--ink2)}
.res .r-tools button:hover{border-color:var(--p);color:var(--pd)}
.exp-row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.exp-row button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:4px 12px;font-size:.72rem;font-weight:700;color:var(--navy)}
.exp-row button:hover{border-color:var(--p);color:var(--pd)}
mark{background:var(--yellow);border-radius:2px;padding:0 1px}
.empty{color:var(--ink3);font-size:.82rem;padding:20px 0;text-align:center}
.loading{color:var(--ink3);font-size:.84rem;padding:36px 0;text-align:center}

@media(max-width:900px){
.wrap{grid-template-columns:1fr}
.side{position:fixed;left:0;top:84px;width:min(84vw,310px);background:#fff;z-index:25;transform:translateX(-105%);transition:transform .25s;box-shadow:8px 0 30px rgba(0,0,0,.12);height:calc(100vh - 84px)}
.side.open{transform:none}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:#fff;border-radius:7px;width:32px;height:32px;font-size:.95rem;color:var(--navy)}
.brand span.txt{display:none}
.law-jump{display:none}
.content{padding:14px 12px 50vh}
.law-head{top:84px}
}
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn">☰</button>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent||''};

const SLUG={hou:'cfc_hou',rei:'cfc_rei',kis:'cfc_kis',tsu:'cfc_tsu'};
const ORDER=['hou','rei','kis','tsu'];
const PFX={hou:'法',rei:'令',kis:'規',tsu:'通'};
const PFX2={hou:'措法',rei:'措令',kis:'措規',tsu:'措通'};
const LAYERS=[['rei','政令（委任・関連規定）'],['kis','省令（添付書類・記載事項等）'],['tsu','解釈通達'],['hou','法律']];
const IROHA='イロハニホヘトチリヌルヲワ';

const state={meta:[],laws:{},notes:JSON.parse(localStorage.getItem('jp4notes')||'{}'),
  obs:JSON.parse(localStorage.getItem('jp4obs')||'[]'),foldLv:0,ext:null};
const saveNotes=()=>localStorage.setItem('jp4notes',JSON.stringify(state.notes));
const saveObs=()=>localStorage.setItem('jp4obs',JSON.stringify(state.obs));
const nk=(slug,id)=>slug+'/'+id;
const lawByKey=k=>state.laws[SLUG[k]];

async function loadLaw(slug){
  if(state.laws[slug])return state.laws[slug];
  const d=await(await fetch('data2/'+slug+'.json')).json();
  d._artMap={};d.arts.forEach((a,i)=>d._artMap[a.id]={a,i});
  d._artNodes={};
  d.order.forEach(ad=>{const n=d.nodes[ad];(d._artNodes[n.art]=d._artNodes[n.art]||[]).push(ad)});
  state.laws[slug]=d;return d;
}
async function loadExt(){
  if(state.ext)return state.ext;
  state.ext=await(await fetch('data2/ext_preview.json')).json();
  return state.ext;
}

/* ---------- 引用形式 ---------- */
function circled(n){
  n=+n;
  if(n>=1&&n<=20)return String.fromCharCode(0x2460+n-1);
  if(n>=21&&n<=35)return String.fromCharCode(0x3251+n-21);
  if(n>=36&&n<=50)return String.fromCharCode(0x32B1+n-36);
  return '('+n+')';
}
const KAN=['','一','二','三','四','五','六','七','八','九'];
function int2kanji(n){
  n=+n;
  if(n<10)return KAN[n];
  if(n<100){const t=Math.floor(n/10),r=n%10;return (t>1?KAN[t]:'')+'十'+(r?KAN[r]:'')}
  return String(n);
}
function citeOf(lk,addr){
  const ps=addr.slice(2).split('.');
  const art=ps[0];
  if(lk==='tsu')return PFX2.tsu+art.replace(/_/g,'の');
  let c=PFX2[lk]+art.replace(/_/g,'の');
  if(ps[1])c+=circled(ps[1]);
  if(ps[2])c+=ps[2].split('_').map(int2kanji).join('の');
  if(ps[3])c+=IROHA[+ps[3]-1]||'';
  return c;
}

/* ---------- ページ内ジャンプ ---------- */
function idOf(lk,addr){return lk+'_'+addr.replace(/\./g,'-')}
function scrollToNode(lk,addr,flash=true){
  let el=document.getElementById(idOf(lk,addr));
  if(!el)el=document.getElementById(idOf(lk,addr.split('.')[0]));
  if(!el)return false;
  el.scrollIntoView({block:'center'});
  if(flash&&el.classList.contains('node')){
    el.classList.add('hl');
    setTimeout(()=>el.classList.remove('hl'),2400);
  }
  history.replaceState(null,'','#'+lk+'@'+addr);
  return true;
}

/* ---------- 描画 ---------- */
function nodeCls(t){return t==='Paragraph'?'para':t==='Item'?'item':t==='Subitem1'?'sub1':t==='Subitem2'?'sub2':'sub3'}
function badge(n,addr,law){
  const has=law.backlinks[addr]?' haslink':'';
  if(n.t==='Paragraph'){
    if(law.key==='tsu')return '<span class="badge'+(n.ti?' chu':' p1')+'" data-addr="'+addr+'">'+esc(n.ti||'¶')+'</span>';
    const p=addr.split('.')[1];
    return '<span class="badge'+(p==='1'?' p1':'')+has+'" data-addr="'+addr+'">'+p+'</span>';
  }
  return '<span class="badge'+has+'" data-addr="'+addr+'">'+esc(n.ti||'・')+'</span>';
}
function renderTbl(tbls){return (tbls||[]).map(rows=>'<div class="tbl-wrap"><table class="law-tbl">'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>').join('')}

function collectBks(law,addrList){
  const out=[];const seen=new Set();
  for(const ad of addrList){
    for(const b of (law.backlinks[ad]||[])){
      const key=b.law==='tsu'?b.law+'@'+b.addr.slice(2).split('.')[0]:b.law+'@'+b.addr;
      if(seen.has(key))continue;
      seen.add(key);out.push(b);
    }
  }
  return out;
}

function renderArticle(law,artId){
  const lk=law.key;
  const addrs=law._artNodes[artId]||[];
  const a0=law._artMap[artId].a;
  const k=nk(law.slug,artId);
  const nt=state.notes[k]||{};
  let h='<div class="art-head" id="'+idOf(lk,'ln'+artId)+'"><span class="art-no">'+esc(lk==='tsu'?'措通'+a0.label:a0.label)+'</span>'+
    (a0.c?'<span class="art-cap">'+esc(a0.c)+'</span>':'')+
    '<span class="art-tools">'+
    '<button class="cite-btn" data-cite="'+esc(citeOf(lk,a0.address))+'" title="引用形式をコピー">'+esc(citeOf(lk,a0.address))+' ⧉</button>'+
    '<button class="star'+(nt.star?' on':'')+'" data-k="'+esc(k)+'">'+(nt.star?'★':'☆')+'</button>'+
    '<button class="pen" data-k="'+esc(k)+'">✎</button></span></div>';
  if(nt.memo)h+='<div class="memo"><div class="lbl">MY NOTE（条メモ）</div><textarea data-k="'+esc(k)+'">'+esc(nt.memo)+'</textarea></div>';
  const paraGroups=[];let curPg=null;
  for(const ad of addrs){
    const n=law.nodes[ad];
    if(n.t==='Article')continue;
    if(n.t==='Paragraph'){curPg={para:ad,list:[ad]};paraGroups.push(curPg)}
    else if(curPg)curPg.list.push(ad);
    else{curPg={para:ad,list:[ad]};paraGroups.push(curPg)}
  }
  for(const pg of paraGroups){
    for(const ad of pg.list){
      const n=law.nodes[ad];
      h+='<div class="node '+nodeCls(n.t)+'" id="'+idOf(lk,ad)+'" data-addr="'+ad+'" data-law="'+lk+'">'+badge(n,ad,law)+
        '<div class="body">'+n.h+renderTbl(n.tbl)+'</div>'+
        '<a class="node-link jmp" data-jump="'+lk+'@'+ad+'" title="リンクをコピーしてジャンプ">¶</a></div>';
    }
    const bks=collectBks(law,pg.list);
    const cnt={};bks.forEach(b=>{cnt[b.law]=(cnt[b.law]||0)+1});
    let bar='';
    for(const [l2] of LAYERS){
      if(l2===lk||!cnt[l2])continue;
      const nm=l2==='rei'?'政令':l2==='kis'?'省令':l2==='tsu'?'通達':'法';
      bar+='<button class="vx-b '+l2+'" data-layer="'+l2+'">'+nm+' '+cnt[l2]+'</button>';
    }
    if(bar)h+='<div class="vx" data-para="'+pg.para+'" data-law="'+lk+'">'+bar+'</div>';
  }
  return h;
}

function renderLawSec(law){
  const lk=law.key;
  let h='<section class="law-sec" id="sec_'+lk+'">'+
    '<div class="law-head"><h1><span class="l-tag '+lk+'">'+PFX[lk]+'</span>'+esc(law.title)+
    '<span class="num">'+esc(law.num)+'</span></h1>'+
    '<div class="rel-row">'+
    (law.lawzilla?'<a class="rel-chip" target="_blank" rel="noopener" href="https://lawzilla.jp/law/'+law.lawzilla+'">Lawzilla ↗</a>'+
    '<a class="rel-chip" target="_blank" rel="noopener" href="https://laws.e-gov.go.jp/law/'+law.lawzilla+'">e-Gov ↗</a>':
    '<a class="rel-chip" target="_blank" rel="noopener" href="https://www.nta.go.jp/law/tsutatsu/kobetsu/hojin/010607/00.htm">国税庁原文 ↗</a>')+
    '</div></div>';
  for(const g of law.groups){
    h+='<div class="grp-head">'+esc(g.label)+'</div>';
    for(const id of g.arts){
      h+=renderArticle(law,id);
    }
  }
  h+='</section>';
  return h;
}

function renderSide(){
  let h='';
  const names={hou:'法律（措置法）',rei:'施行令',kis:'施行規則',tsu:'通達'};
  for(const lk of ORDER){
    const law=lawByKey(lk);
    if(!law)continue;
    h+='<details class="l-'+lk+'"'+(lk==='hou'?' open':'')+'><summary>'+esc(names[lk])+'</summary>';
    for(const g of law.groups){
      h+='<div class="grp">'+esc(g.label)+'</div>';
      for(const id of g.arts){
        const a=law._artMap[id].a;
        const k=nk(law.slug,id);
        const star=state.notes[k]&&state.notes[k].star?'<span class="star">★ </span>':'';
        h+='<a class="jmp" data-jump="'+lk+'@ln'+id+'" data-prev="'+lk+'@ln'+id+'">'+star+esc(a.label)+
          (a.c?' <span class="cap">'+esc(a.c)+'</span>':'')+'</a>';
      }
    }
    h+='</details>';
  }
  $('#side').innerHTML=h;
}

/* ---------- 検索（オーバーレイ・移動なし） ---------- */
function artText(law,artId){
  const a=law._artMap[artId].a;
  return a.label+' '+(a.c||'')+' '+(law._artNodes[artId]||[]).map(ad=>{const n=law.nodes[ad];return (n.ti||'')+strip(n.h)}).join(' ');
}
function snippet(t,kw){
  const i=t.indexOf(kw);if(i<0)return esc(t.slice(0,90))+'…';
  const s=Math.max(0,i-40);
  return (s>0?'…':'')+esc(t.slice(s,i))+'<mark>'+esc(kw)+'</mark>'+esc(t.slice(i+kw.length,i+kw.length+55))+'…';
}
function doSearch(kw){
  const out=[];
  const num=kw.match(/^(\d+)(?:[の_-]\d+)*$/);
  for(const lk of ORDER){
    const law=lawByKey(lk);
    if(num){
      const id=kw.split(/[の_-]/).join('_');
      if(law._artMap[id])out.push({lk,id,snip:esc(law._artMap[id].a.c||'')});
    }
    for(const a of law.arts){
      const tx=artText(law,a.id);
      if(tx.includes(kw))out.push({lk,id:a.id,snip:snippet(tx,kw)});
      if(out.length>200)break;
    }
  }
  $('#spTitle').textContent='検索: '+kw+'（'+out.length+'件）';
  $('#spBody').innerHTML=out.length?out.map(r=>{
    const law=lawByKey(r.lk);const a=law._artMap[r.id].a;
    return '<div class="res jmp" data-jump="'+r.lk+'@ln'+r.id+'" data-prev="'+r.lk+'@ln'+r.id+'">'+
      '<span class="r-law">'+esc(PFX[r.lk])+'</span><span class="r-t">'+esc(a.label)+(a.c?'　'+esc(a.c):'')+'</span>'+
      '<div class="r-s">'+r.snip+'</div></div>';
  }).join(''):'<div class="empty">見つかりませんでした。条番号（例: 66の6）や別の語で。</div>';
  $('#searchPanel').classList.add('open');
  $('#notesPanel').classList.remove('open');
}

/* ---------- 観察ノート ---------- */
function fmtDate(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function openObsDlg(o,editId){
  const dlg=$('#obsDlg');
  dlg.innerHTML='<div class="d-h"><span>'+(editId?'観察を編集':'⊕ 観察ノート')+'</span><button id="obsClose">✕</button></div>'+
    '<div class="d-b">'+
    '<span class="d-cite">'+esc(o.cite)+'</span> <span style="font-size:.7rem;color:var(--ink3)">'+esc(o.ka||'')+'</span>'+
    '<label>引用（条文）</label><textarea id="obsQ" class="d-q" rows="3">'+esc(o.quote||'')+'</textarea>'+
    '<label>観察・違和感・コメント</label><textarea id="obsC" rows="4" placeholder="なぜ気になったか、何と矛盾するか…">'+esc(o.comment||'')+'</textarea>'+
    '<label>タグ（スペース区切り）</label><input id="obsT" value="'+esc((o.tags||[]).join(' '))+'" placeholder="例: 例に準じて 株主相対性">'+
    '</div>'+
    '<div class="d-f"><button id="obsCancel">キャンセル</button><button class="save" id="obsSave">保存</button></div>';
  dlg.style.display='flex';
  $('#obsClose').onclick=$('#obsCancel').onclick=()=>{dlg.style.display='none'};
  $('#obsSave').onclick=()=>{
    const rec={id:editId||('o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      ts:editId?(state.obs.find(x=>x.id===editId)||{}).ts||Date.now():Date.now(),
      lk:o.lk,slug:o.slug,addr:o.addr,ka:o.ka,cite:o.cite,
      quote:$('#obsQ').value.trim(),comment:$('#obsC').value.trim(),
      tags:$('#obsT').value.trim().split(/\s+/).filter(Boolean)};
    if(editId){const i=state.obs.findIndex(x=>x.id===editId);if(i>=0)state.obs[i]=rec;else state.obs.push(rec)}
    else state.obs.push(rec);
    saveObs();dlg.style.display='none';
    restoreHighlights();
  };
  setTimeout(()=>$('#obsC').focus(),50);
}
const obsBtn=$('#obsBtn');
let selCtx=null;
document.addEventListener('mouseup',e=>{
  if(e.target.closest('#obsBtn,#obsDlg,.pv,.panel'))return;
  setTimeout(()=>{
    const sel=getSelection();
    if(sel.isCollapsed||!sel.toString().trim()){obsBtn.style.display='none';return}
    const nodeEl=sel.anchorNode&&sel.anchorNode.parentElement&&sel.anchorNode.parentElement.closest('.node');
    if(!nodeEl||!$('#main').contains(nodeEl)){obsBtn.style.display='none';return}
    const lk=nodeEl.dataset.law;
    const law=lawByKey(lk);
    if(!law){obsBtn.style.display='none';return}
    const addr=nodeEl.dataset.addr;
    const n=law.nodes[addr];
    selCtx={lk,slug:law.slug,addr,ka:PFX[lk]+n.ka,cite:citeOf(lk,addr),quote:sel.toString().trim()};
    const r=sel.getRangeAt(0).getBoundingClientRect();
    obsBtn.style.left=Math.min(r.right+6,innerWidth-110)+'px';
    obsBtn.style.top=Math.max(60,r.top-34)+'px';
    obsBtn.style.display='block';
  },10);
});
obsBtn.addEventListener('click',()=>{
  obsBtn.style.display='none';
  if(selCtx)openObsDlg(selCtx);
});
function restoreHighlights(){
  for(const o of state.obs){
    const el=document.getElementById(idOf(o.lk,o.addr));
    if(!el)continue;
    const body=el.querySelector('.body');
    if(!body||body.querySelector('mark.note-hl[data-note="'+o.id+'"]'))continue;
    let q=o.quote;
    if(!q)continue;
    for(const probe of [q,q.slice(0,60),q.slice(0,25)]){
      if(probe.length<4)break;
      if(markText(body,probe,o.id))break;
    }
  }
}
function markText(root,probe,noteId){
  const tns=[];let full='';
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let t;
  while((t=tw.nextNode())){
    if(!t.parentElement.closest('mark.note-hl'))tns.push({node:t,start:full.length});
    full+=t.textContent;
  }
  const i=full.indexOf(probe);
  if(i<0)return false;
  const end=i+probe.length;
  const targets=[];
  for(const e of tns){
    const s=e.start,len=e.node.textContent.length;
    const a=Math.max(i,s),b=Math.min(end,s+len);
    if(a<b)targets.push({node:e.node,from:a-s,to:b-s});
  }
  let ok=false;
  for(const g of targets){
    const r=document.createRange();
    r.setStart(g.node,g.from);r.setEnd(g.node,g.to);
    const m=document.createElement('mark');
    m.className='note-hl';m.dataset.note=noteId;
    try{r.surroundContents(m);ok=true}catch(err){}
  }
  return ok;
}
/* ノートパネル */
function renderNotes(){
  const obs=[...state.obs].sort((a,b)=>b.ts-a.ts);
  const starKeys=Object.keys(state.notes).filter(k=>state.notes[k].star||state.notes[k].memo);
  let h='<div class="exp-row">'+
    '<button id="expMd">⬇ Markdown</button>'+
    '<button id="expJson">⬇ JSON</button>'+
    '<button id="impJson">⬆ JSON読込</button>'+
    '<input type="file" id="impFile" accept=".json" style="display:none">'+
    '</div>';
  if(obs.length){
    for(const o of obs){
      h+='<div class="res"><span class="r-law">'+esc(o.cite)+'</span><span class="r-t" style="font-size:.74rem;color:var(--ink3)">'+fmtDate(o.ts)+'</span>'+
        (o.quote?'<div class="r-q">'+esc(o.quote.slice(0,140))+(o.quote.length>140?'…':'')+'</div>':'')+
        (o.comment?'<div class="r-s">💭 '+esc(o.comment)+'</div>':'')+
        (o.tags&&o.tags.length?'<div class="r-s" style="color:var(--pd)">'+o.tags.map(t=>'#'+esc(t)).join(' ')+'</div>':'')+
        '<div class="r-tools">'+
        '<button data-act="jump" data-id="'+o.id+'">開く</button>'+
        '<button data-act="copy" data-id="'+o.id+'">引用⧉</button>'+
        '<button data-act="edit" data-id="'+o.id+'">編集</button>'+
        '<button data-act="del" data-id="'+o.id+'">削除</button></div></div>';
    }
  }
  if(starKeys.length){
    h+='<div class="grp" style="font-size:.74rem;font-weight:900;color:var(--navy);background:var(--p25);border-radius:6px;padding:3px 10px;margin:10px 0 6px">条単位のメモ・★</div>';
    for(const k of starKeys){
      const [sl,id]=k.split('/');
      const law=state.laws[sl];
      if(!law||!law._artMap[id])continue;
      const nt=state.notes[k];const a=law._artMap[id].a;
      h+='<div class="res jmp" data-jump="'+law.key+'@ln'+id+'"><span class="r-law">'+esc(PFX[law.key])+'</span>'+
        (nt.star?'<span style="color:var(--accent)">★ </span>':'')+
        '<span class="r-t">'+esc(a.label)+(a.c?'　'+esc(a.c):'')+'</span>'+
        (nt.memo?'<div class="r-s">📝 '+esc(nt.memo).slice(0,120)+'</div>':'')+'</div>';
    }
  }
  if(!obs.length&&!starKeys.length)h+='<div class="empty">まだノートがありません。<br>本文を選択→⊕観察、または条見出しの ☆/✎。</div>';
  $('#npBody').innerHTML=h;
  $('#expMd').onclick=exportMd;
  $('#expJson').onclick=()=>download('cfc_notes_'+fmtDate(Date.now())+'.json',JSON.stringify({obs:state.obs,notes:state.notes},null,1));
  $('#impJson').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(Array.isArray(d.obs)){
        const ids=new Set(state.obs.map(o=>o.id));
        d.obs.forEach(o=>{if(!ids.has(o.id))state.obs.push(o)});
      }
      if(d.notes)Object.assign(state.notes,d.notes);
      saveObs();saveNotes();renderNotes();restoreHighlights();
    }catch(err){alert('読込失敗: '+err)}
  };
}
function exportMd(){
  const obs=[...state.obs].sort((a,b)=>a.cite.localeCompare(b.cite,'ja'));
  let md='# CFC条文ブラウザ 観察ノート\n\nエクスポート: '+fmtDate(Date.now())+' ／ '+obs.length+'件\n\n';
  for(const o of obs){
    md+='## '+o.cite+(o.ka?'（'+o.ka+'）':'')+'\n\n';
    if(o.quote)md+='> '+o.quote.replace(/\n/g,'\n> ')+'\n\n';
    if(o.comment)md+=o.comment+'\n\n';
    const meta=[];
    if(o.tags&&o.tags.length)meta.push(o.tags.map(t=>'#'+t).join(' '));
    meta.push(fmtDate(o.ts));
    meta.push(o.lk+'@'+o.addr);
    md+='*（'+meta.join(' ／ ')+'）*\n\n---\n\n';
  }
  const starKeys=Object.keys(state.notes).filter(k=>state.notes[k].memo);
  if(starKeys.length){
    md+='# 付録: 条単位メモ\n\n';
    for(const k of starKeys)md+='- **'+k+'**: '+state.notes[k].memo.replace(/\n/g,' ')+'\n';
  }
  download('CFC観察ノート_'+fmtDate(Date.now())+'.md',md);
}
function download(name,content){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('コピーしました'),()=>toast('コピー失敗'))}
let toastTimer=null;
function toast(msg){
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:.78rem;font-weight:700;padding:7px 18px;border-radius:999px;z-index:99;box-shadow:0 10px 30px -8px rgba(0,40,60,.5)';document.body.appendChild(t)}
  t.textContent=msg;t.style.display='block';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',1600);
}

/* ---------- 縦串インライン展開 ---------- */
async function renderVxSec(law,paraAddr,layer){
  const para=law.nodes[paraAddr];
  const addrList=(law._artNodes[para.art]||[]).filter(ad=>ad===paraAddr||ad.startsWith(paraAddr+'.'));
  const bks=collectBks(law,addrList).filter(b=>b.law===layer);
  let h='';
  for(const b of bks){
    const law2=lawByKey(b.law);
    if(b.law==='tsu'){
      const art=b.addr.slice(2).split('.')[0];
      const e=law2._artMap[art];if(!e)continue;
      h+='<div class="impl"><div class="impl-ka"><a class="jmp" data-jump="tsu@ln'+art+'">措通'+esc(e.a.label)+'</a>'+
        (e.a.c?'<span class="cap">'+esc(e.a.c)+'</span>':'')+'</div>';
      for(const ad2 of (law2._artNodes[art]||[])){
        const n2=law2.nodes[ad2];if(n2.t==='Article')continue;
        h+='<div class="impl-b">'+(n2.ti?'<b>（'+esc(n2.ti)+'）</b>':'')+n2.h+'</div>';
      }
      h+='</div>';
    }else{
      const n2=law2.nodes[b.addr];if(!n2)continue;
      h+='<div class="impl"><div class="impl-ka"><a class="jmp" data-jump="'+b.law+'@'+b.addr+'">'+esc(PFX[b.law]+n2.ka)+'</a>'+
        (n2.c?'<span class="cap">'+esc(n2.c)+'</span>':'')+'</div><div class="impl-b">'+n2.h+renderTbl(n2.tbl)+'</div></div>';
    }
  }
  return h||'<div style="font-size:.74rem;color:var(--ink3)">なし</div>';
}
async function toggleVx(btn){
  const vx=btn.closest('.vx');const layer=btn.dataset.layer;
  const old=vx.querySelector('.vx-sec[data-layer="'+layer+'"]');
  if(old){old.remove();btn.classList.remove('on');return}
  btn.classList.add('on');
  const law=lawByKey(vx.dataset.law);
  const sec=document.createElement('div');
  sec.className='vx-sec';sec.dataset.layer=layer;
  sec.innerHTML='<div style="font-size:.74rem;color:var(--ink3)">読み込み中…</div>';
  vx.appendChild(sec);
  sec.innerHTML=await renderVxSec(law,vx.dataset.para,layer);
  applyFold(sec,state.foldLv);
}
let vxAllOn=false;
async function vxToggleAll(){
  vxAllOn=!vxAllOn;
  $('#vxAll').classList.toggle('on',vxAllOn);
  if(!vxAllOn){
    document.querySelectorAll('.vx-sec').forEach(x=>x.remove());
    document.querySelectorAll('.vx-b.on').forEach(x=>x.classList.remove('on'));
    return;
  }
  const btns=[...document.querySelectorAll('.vx-b:not(.on)')];
  for(let i=0;i<btns.length;i++){
    await toggleVx(btns[i]);
    if(i%20===19)await new Promise(r=>setTimeout(r,30));
  }
}

/* ---------- 括弧折りたたみ ---------- */
const foldStore=new WeakMap();
function foldEl(sp){
  if(foldStore.has(sp))return;
  const frag=document.createDocumentFragment();
  while(sp.firstChild)frag.appendChild(sp.firstChild);
  foldStore.set(sp,frag);
  sp.textContent='〔…〕';
  sp.classList.add('kfold');
}
function unfoldEl(sp){
  const frag=foldStore.get(sp);
  if(!frag)return;
  sp.textContent='';sp.appendChild(frag);
  foldStore.delete(sp);sp.classList.remove('kfold');
}
function kakkoLevel(sp){
  for(const c of sp.classList){if(c==='kakko')return 1;const m=c.match(/^kakko-(\d)/);if(m)return +m[1]}
  return 0;
}
function applyFold(root,lv){
  root.querySelectorAll('.kakko,.kakko-2,.kakko-3,.kakko-4,.kakko-5').forEach(sp=>{
    const l=kakkoLevel(sp);
    if(lv>0&&l>=lv)foldEl(sp);else unfoldEl(sp);
  });
}

/* ---------- プレビュー窓 ---------- */
const PV={hover:null,hoverAnchor:null,closeTimer:null,seq:0};
function pvClose(win){if(win){win.remove();if(PV.hover===win){PV.hover=null;PV.hoverAnchor=null}}}
function pvCloseAll(){document.querySelectorAll('.pv').forEach(w=>w.remove());PV.hover=null;PV.hoverAnchor=null}
function pvScheduleClose(){
  clearTimeout(PV.closeTimer);
  PV.closeTimer=setTimeout(()=>{if(PV.hover&&!PV.hover.matches(':hover'))pvClose(PV.hover)},350);
}
function pvCancelClose(){clearTimeout(PV.closeTimer)}
function pvPin(win){
  win.classList.add('pinned');
  if(PV.hover===win){PV.hover=null;PV.hoverAnchor=null}
  const pinBtn=win.querySelector('.pv-pin');
  if(pinBtn)pinBtn.textContent='✕',pinBtn.title='閉じる',pinBtn.onclick=()=>pvClose(win);
}
function pvMakeDraggable(win){
  const h=win.querySelector('.pv-h');
  let sx,sy,ox,oy,drag=false;
  h.addEventListener('mousedown',e=>{
    if(e.target.tagName==='BUTTON')return;
    drag=true;sx=e.clientX;sy=e.clientY;
    const r=win.getBoundingClientRect();ox=r.left;oy=r.top;
    if(!win.classList.contains('pinned'))pvPin(win);
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    win.style.left=Math.max(4,ox+e.clientX-sx)+'px';
    win.style.top=Math.max(4,oy+e.clientY-sy)+'px';
  });
  document.addEventListener('mouseup',()=>{drag=false});
}
function pvSpawn(content,anchorRect){
  const win=document.createElement('div');
  win.className='pv'+(content.wide?' pv-wide':'');win.dataset.pv=++PV.seq;
  let foot='';
  if(content.jumpData)foot+='<a class="jmp" data-jump="'+content.jumpData+'">本文へ →</a>';
  if(content.extHref)foot+='<a href="'+content.extHref+'" target="_blank" rel="noopener">Lawzillaで開く ↗</a>';
  if(content.cite)foot+='<button class="pv-cite">引用⧉</button>';
  if(content.quote!==undefined)foot+='<button class="pv-obs">⊕観察</button>';
  win.innerHTML='<div class="pv-h"><span class="pv-ka">'+esc(content.ka)+'</span>'+
    '<button class="pv-pin" title="ピン留め">📌</button></div>'+
    '<div class="pv-b">'+(content.cap?'<div class="cap">'+esc(content.cap)+'</div>':'')+content.bodyHtml+
    (content.extra||'')+'</div>'+
    (foot?'<div class="pv-f">'+foot+'</div>':'');
  document.body.appendChild(win);
  const W=win.offsetWidth,Hh=win.offsetHeight;
  let x=anchorRect.left,y=anchorRect.bottom+8;
  if(y+Hh>innerHeight-10)y=Math.max(8,anchorRect.top-Hh-8);
  if(x+W>innerWidth-10)x=Math.max(8,innerWidth-W-12);
  win.style.left=x+'px';win.style.top=y+'px';
  win.addEventListener('mouseenter',pvCancelClose);
  win.addEventListener('mouseleave',()=>{if(!win.classList.contains('pinned'))pvScheduleClose()});
  win.querySelector('.pv-pin').onclick=()=>pvPin(win);
  const cb=win.querySelector('.pv-cite');
  if(cb)cb.onclick=()=>copyText(content.cite+(content.quote?'\n「'+content.quote.slice(0,200)+'」':''));
  const ob=win.querySelector('.pv-obs');
  if(ob)ob.onclick=()=>{pvPin(win);openObsDlg({lk:content.lk,slug:content.slug,addr:content.addr,ka:content.ka,cite:content.cite,quote:(content.quote||'').slice(0,300)})};
  pvMakeDraggable(win);
  return win;
}
async function pvContentFor(el){
  if(el.dataset.prev||el.matches('a.self')){
    const dl=el.dataset.prev||el.dataset.link;
    const [lk,addr]=dl.split('@');
    const law=lawByKey(lk)||await loadLaw(SLUG[lk]);
    let n=law.nodes[addr]||law.nodes[addr.split('.').slice(0,3).join('.')]||law.nodes[addr.split('.').slice(0,2).join('.')]||law.nodes[addr.split('.')[0]];
    if(!n)return null;
    let bodyHtml=n.h;
    let cap=n.c||'';
    if(n.t==='Article'){
      const p1=law.nodes[addr.split('.')[0]+'.1'];
      if(p1)bodyHtml=p1.h;
      cap=n.c||((law._artMap[n.art]&&law._artMap[n.art].a.c)||'');
    }
    return {ka:PFX[lk]+n.ka,cap,bodyHtml,jumpData:lk+'@'+addr,cite:citeOf(lk,addr),
      quote:strip(bodyHtml).slice(0,300),lk,slug:SLUG[lk],addr};
  }
  if(el.matches('a.law[data-ext]')){
    const ev=await loadExt();
    const e=ev[el.dataset.ext];
    if(!e)return null;
    return {ka:e.ka,cap:e.c||'',bodyHtml:esc(e.t),extHref:el.href,cite:e.ka,quote:e.t.slice(0,300)};
  }
  if(el.matches('.term')){
    const [lk,addr]=el.dataset.def.split('@');
    const law=lawByKey(lk);
    const n=law&&law.nodes[addr];
    if(!n)return null;
    return {ka:'定義: '+el.textContent,bodyHtml:n.h,
      extra:'<div class="defsrc">定義位置: <a class="jmp" data-jump="'+lk+'@'+addr+'">'+esc(PFX[lk]+n.ka)+'</a></div>',
      jumpData:lk+'@'+addr,cite:citeOf(lk,addr),quote:strip(n.h).slice(0,300),lk,slug:SLUG[lk],addr};
  }
  if(el.matches('.kfold')){
    const frag=foldStore.get(el);
    if(!frag)return null;
    const tmp=document.createElement('div');tmp.appendChild(frag.cloneNode(true));
    return {ka:'〔…〕括弧の内容',bodyHtml:tmp.innerHTML};
  }
  if(el.matches('mark.note-hl')){
    const o=state.obs.find(x=>x.id===el.dataset.note);
    if(!o)return null;
    return {ka:'📝 '+o.cite,bodyHtml:(o.comment?esc(o.comment):'<span style="color:var(--ink3)">（コメントなし）</span>')+
      (o.tags&&o.tags.length?'<div style="color:var(--pd);font-size:.74rem;margin-top:4px">'+o.tags.map(t=>'#'+esc(t)).join(' ')+'</div>':''),
      extra:'<div class="defsrc"><a href="#" class="pv-edit" data-id="'+o.id+'">編集</a>　<a href="#" class="pv-del" data-id="'+o.id+'">削除</a></div>'};
  }
  if(el.matches('.badge.haslink')){
    const nodeEl=el.closest('.node');
    if(!nodeEl)return null;
    const law=lawByKey(nodeEl.dataset.law);
    const addr=el.dataset.addr;
    const bks=law.backlinks[addr]||[];
    if(!bks.length)return null;
    const byLayer={};
    bks.forEach(b=>{(byLayer[b.law]=byLayer[b.law]||[]).push(b)});
    let html='<div class="pop-list">';
    for(const [lk,label] of LAYERS){
      if(!byLayer[lk])continue;
      html+='<div style="font-size:.66rem;font-weight:900;color:var(--ink3);margin-top:4px">'+esc(label)+'</div>';
      html+=byLayer[lk].map(b=>'<a class="jmp" data-jump="'+b.law+'@'+b.addr+'">'+esc(b.ka)+'</a>').join('');
    }
    html+='</div>';
    return {ka:'⛓ '+PFX[law.key]+law.nodes[addr].ka+' を参照している規定（'+bks.length+'）',bodyHtml:html};
  }
  if(el.matches('.deleg')){
    const layer=el.dataset.layer;
    const lname=layer==='rei'?'政令':'省令';
    if(el.dataset.impl){
      const items=el.dataset.impl.split('|');
      let html='';let shown=0;
      for(const it of items){
        if(shown>=3)break;
        const [lk,addr]=it.split('@');
        const law2=lawByKey(lk);
        const n=law2&&law2.nodes[addr];
        if(!n)continue;
        html+='<div class="impl"><div class="impl-ka"><a class="jmp" data-jump="'+lk+'@'+addr+'">'+esc(PFX[lk]+n.ka)+'</a>'+
          (n.c?'<span class="cap">'+esc(n.c)+'</span>':'')+'</div><div class="impl-b">'+n.h+'</div></div>';
        shown++;
      }
      if(items.length>shown){
        html+='<div class="impl-more">ほか'+(items.length-shown)+'件: ';
        for(const it of items.slice(shown)){
          const [lk,addr]=it.split('@');
          const law2=lawByKey(lk);
          const n=law2&&law2.nodes[addr];
          if(n)html+='<a class="jmp" data-jump="'+lk+'@'+addr+'" data-prev="'+lk+'@'+addr+'">'+esc(PFX[lk]+n.ka)+'</a>';
        }
        html+='</div>';
      }
      if(html){
        return {ka:'「'+lname+'で定める'+esc(el.dataset.t||'')+'」の委任先',bodyHtml:html,wide:true,
          jumpData:items[0]};
      }
    }
    const nodeEl=el.closest('.node');
    if(!nodeEl)return null;
    const law=lawByKey(nodeEl.dataset.law);
    const lnAddr=nodeEl.dataset.addr;
    let list=(law.backlinks[lnAddr]||[]).filter(b=>b.law===layer);
    let scope=lnAddr;
    if(!list.length){
      const artAddr=lnAddr.split('.')[0];
      const seen=new Set();list=[];
      for(const ad of (law._artNodes[artAddr.slice(2)]||[])){
        for(const b of (law.backlinks[ad]||[])){
          if(b.law===layer&&!seen.has(b.addr)){seen.add(b.addr);list.push(b)}
        }
      }
      scope=artAddr+'（条単位）';
    }
    return {ka:lname+'への委任 — '+scope.replace('ln',''),
      bodyHtml:list.length?'<div class="pop-list">'+list.map(b=>'<a class="jmp" data-jump="'+b.law+'@'+b.addr+'" data-prev="'+b.law+'@'+b.addr+'">'+esc(b.ka)+'</a>').join('')+'</div>':
      '<span style="color:var(--ink3);font-size:.76rem">この'+lname+'委任に対応する規定は抜粋範囲に見つかりません</span>'};
  }
  return null;
}
let hoverTimer=null;
document.addEventListener('mouseover',e=>{
  const el=e.target.closest('a.self,a.law[data-ext],.term,.kfold,mark.note-hl,[data-prev],.badge.haslink,.deleg');
  clearTimeout(hoverTimer);
  if(!el){pvScheduleClose();return}
  pvCancelClose();
  hoverTimer=setTimeout(async()=>{
    if(PV.hoverAnchor===el&&PV.hover)return;
    const content=await pvContentFor(el);
    if(!content)return;
    if(PV.hover)pvClose(PV.hover);
    const win=pvSpawn(content,el.getBoundingClientRect());
    PV.hover=win;PV.hoverAnchor=el;
  },140);
});
document.addEventListener('mouseout',e=>{
  const el=e.target.closest('a.self,a.law[data-ext],.term,.kfold,mark.note-hl,[data-prev],.badge.haslink,.deleg');
  if(el&&PV.hoverAnchor===el)pvScheduleClose();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    pvCloseAll();
    $('#obsDlg').style.display='none';
    obsBtn.style.display='none';
    $('#searchPanel').classList.remove('open');
    $('#notesPanel').classList.remove('open');
  }
});

/* ---------- クリック ---------- */
document.addEventListener('click',e=>{
  const pe=e.target.closest('.pv-edit');
  if(pe){e.preventDefault();const o=state.obs.find(x=>x.id===pe.dataset.id);if(o)openObsDlg(o,o.id);return}
  const pd=e.target.closest('.pv-del');
  if(pd){e.preventDefault();if(confirm('この観察を削除しますか？')){state.obs=state.obs.filter(x=>x.id!==pd.dataset.id);saveObs();pvCloseAll();
    document.querySelectorAll('mark.note-hl[data-note="'+pd.dataset.id+'"]').forEach(m=>m.replaceWith(...m.childNodes));}return}
  const act=e.target.closest('button[data-act]');
  if(act){
    const o=state.obs.find(x=>x.id===act.dataset.id);
    if(!o)return;
    if(act.dataset.act==='jump'){scrollToNode(o.lk,o.addr);$('#notesPanel').classList.remove('open')}
    else if(act.dataset.act==='copy')copyText(o.cite+'\n「'+o.quote+'」');
    else if(act.dataset.act==='edit')openObsDlg(o,o.id);
    else if(act.dataset.act==='del'){if(confirm('この観察を削除しますか？')){state.obs=state.obs.filter(x=>x.id!==o.id);saveObs();renderNotes();
      document.querySelectorAll('mark.note-hl[data-note="'+o.id+'"]').forEach(m=>m.replaceWith(...m.childNodes));}}
    return;
  }
  const j=e.target.closest('.jmp');
  if(j&&j.dataset.jump){
    if(j.classList.contains('node-link'))copyText(location.origin+location.pathname+'#'+j.dataset.jump);
    const [lk,addr]=j.dataset.jump.split('@');
    scrollToNode(lk,addr);
    if(j.closest('#searchPanel'))$('#searchPanel').classList.remove('open');
    $('#side').classList.remove('open');
    return;
  }
  const vb=e.target.closest('.vx-b');
  if(vb){toggleVx(vb);return}
  const cbn=e.target.closest('.cite-btn');
  if(cbn){copyText(cbn.dataset.cite);return}
  const self=e.target.closest('a.self');
  if(self){
    const [lk,addr]=self.dataset.link.split('@');
    scrollToNode(lk,addr);
    return;
  }
  const kf=e.target.closest('.kfold');
  if(kf){unfoldEl(kf);e.stopPropagation();return}
  const kk=e.target.closest('.kakko,.kakko-2,.kakko-3,.kakko-4,.kakko-5');
  if(kk&&!e.target.closest('a')&&!e.target.closest('.term')&&!e.target.closest('.deleg')&&!getSelection().toString()){foldEl(kk);e.stopPropagation()}
});

/* ---------- 条メモ・★ ---------- */
function bindTools(){
  document.querySelectorAll('.art-tools .star').forEach(b=>{
    if(b.dataset.bound)return;b.dataset.bound=1;
    b.addEventListener('click',()=>{
      const k=b.dataset.k;
      state.notes[k]=state.notes[k]||{};
      state.notes[k].star=!state.notes[k].star;
      if(!state.notes[k].star&&!state.notes[k].memo)delete state.notes[k];
      saveNotes();
      b.classList.toggle('on');b.textContent=b.classList.contains('on')?'★':'☆';
    });
  });
  document.querySelectorAll('.art-tools .pen').forEach(b=>{
    if(b.dataset.bound)return;b.dataset.bound=1;
    b.addEventListener('click',()=>{
      const head=b.closest('.art-head');
      let m=head.nextElementSibling;
      if(m&&m.classList.contains('memo')){m.remove();return}
      const k=b.dataset.k;
      const nt=state.notes[k]||{};
      const d=document.createElement('div');d.className='memo';
      d.innerHTML='<div class="lbl">MY NOTE（条メモ）</div><textarea data-k="'+esc(k)+'" placeholder="この条文のメモ…">'+esc(nt.memo||'')+'</textarea>';
      head.parentNode.insertBefore(d,head.nextSibling);
      bindMemo(d.querySelector('textarea'));d.querySelector('textarea').focus();
    });
  });
  document.querySelectorAll('.memo textarea').forEach(bindMemo);
}
function bindMemo(ta){
  if(ta.dataset.bound)return;ta.dataset.bound=1;
  ta.addEventListener('input',()=>{
    const k=ta.dataset.k;
    state.notes[k]=state.notes[k]||{};
    state.notes[k].memo=ta.value;
    if(!ta.value&&!state.notes[k].star)delete state.notes[k];
    saveNotes();
  });
}

$('#vxAll').addEventListener('click',vxToggleAll);
document.querySelectorAll('.kbtn[data-fold]').forEach(b=>b.addEventListener('click',()=>{
  state.foldLv=+b.dataset.fold;
  document.querySelectorAll('.kbtn[data-fold]').forEach(x=>x.classList.toggle('on',x===b));
  applyFold($('#main'),state.foldLv);
}));

/* ---------- 起動 ---------- */
(async()=>{
  state.meta=await(await fetch('data2/meta.json')).json();

  if(m)setTimeout(()=>scrollToNode(m[1],m[2]),200);
})();
