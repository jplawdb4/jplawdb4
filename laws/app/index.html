<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFC条文ブラウザ | JPLAWDB4</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2300AEC6%22/><text x=%2250%22 y=%2272%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>法</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f3;--surface:#fff;--p:#00AEC6;--pd:#008193;--p25:#E8FCFF;--navy:#005870;
--ink:#121921;--ink2:#4d5a66;--ink3:#8b97a1;--line:#e3e8e2;--line2:#cfd7d0;--yellow:#FCE48A;--yellow50:#fef8e1;
--pink:#e91e63;--pink-soft:#fde7ef;--accent:#b23e59;
--sans:"Noto Sans JP","Hiragino Sans",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:2.0;-webkit-font-smoothing:antialiased}
::selection{background:rgba(0,174,198,.18)}
button{font-family:var(--sans);cursor:pointer}

/* ===== topbar ===== */
.topbar{background:var(--surface);border-bottom:2px solid var(--p);position:sticky;top:0;z-index:40}
.topbar-in{width:min(100%,1500px);margin:0 auto;padding:7px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.94rem;color:var(--navy);text-decoration:none;white-space:nowrap}
.brand .mark{width:27px;height:27px;border-radius:7px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-size:.76rem;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.lawsel{font-family:var(--sans);font-size:.8rem;font-weight:700;color:var(--navy);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;background:var(--bg);max-width:230px}
.searchbox{flex:1;display:flex;position:relative;max-width:480px}
.searchbox input{width:100%;font-family:var(--sans);font-size:.84rem;border:1px solid var(--line2);border-radius:8px;padding:7px 12px 7px 32px;background:var(--bg);outline:none;transition:.2s}
.searchbox input:focus{border-color:var(--p);background:#fff}
.searchbox .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:.8rem;pointer-events:none}
.tb-btn{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:5px 11px;font-size:.76rem;font-weight:700;color:var(--navy);white-space:nowrap;transition:.2s}
.tb-btn:hover{border-color:var(--p);color:var(--pd)}
.menu-btn{display:none}

/* ===== kakko control bar ===== */
.ctlbar{background:var(--p25);border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:35}
.ctlbar-in{width:min(100%,1500px);margin:0 auto;padding:5px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl-l{font-size:.7rem;font-weight:700;color:var(--pd);letter-spacing:.06em}
.kbtn{border:1px solid rgba(0,174,198,.45);background:#fff;border-radius:999px;padding:2px 12px;font-size:.72rem;font-weight:700;color:var(--pd);transition:.15s}
.kbtn:hover,.kbtn.on{background:var(--p);color:#fff;border-color:var(--p)}
.ctl-hint{margin-left:auto;font-size:.68rem;color:var(--ink3)}

/* ===== layout ===== */
.wrap{width:min(100%,1500px);margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr) 230px;align-items:start}
.side{position:sticky;top:84px;height:calc(100vh - 84px);overflow-y:auto;padding:12px 6px 60px 12px;border-right:1px solid var(--line);background:rgba(255,255,255,.55)}
.side .grp{font-size:.72rem;font-weight:900;color:var(--navy);background:var(--p25);border-radius:6px;padding:3px 10px;margin:10px 0 3px}
.side a{display:block;font-size:.78rem;color:var(--ink2);text-decoration:none;padding:2px 8px;border-radius:6px;line-height:1.7}
.side a:hover{background:var(--p25);color:var(--pd)}
.side a.cur{background:var(--p25);color:var(--pd);font-weight:700;border-left:3px solid var(--p)}
.side a .cap{color:var(--ink3);font-size:.72rem}
.side a.cur .cap{color:var(--pd)}
.side a .star{color:var(--accent);font-size:.7rem}
.content{padding:18px 22px 140px;min-width:0;background:var(--surface);min-height:70vh;border-right:1px solid var(--line)}

/* right rail (今すぐ条文にジャンプ) */
.rail{position:sticky;top:84px;max-height:calc(100vh - 84px);overflow-y:auto;padding:12px 12px 60px 10px}
.rail .r-h{font-size:.7rem;font-weight:900;color:#fff;background:var(--p);border-radius:7px 7px 0 0;padding:4px 12px;letter-spacing:.06em}
.rail .r-b{border:1px solid var(--line);border-top:0;border-radius:0 0 7px 7px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:2px}
.rail a{font-size:.74rem;color:var(--ink2);text-decoration:none;padding:1px 8px;border-radius:5px;line-height:1.7}
.rail a:hover{background:var(--pink-soft);color:var(--pink)}
.rail a.lv2{padding-left:20px;font-size:.7rem}
.rail .r-h.bk{background:var(--accent);margin-top:14px}
.rail a.bk{color:var(--ink2)}

/* ===== law content ===== */
.crumb{font-size:.72rem;color:var(--ink3);margin:0 0 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--pd);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.law-title{font-size:1.3rem;font-weight:900;color:var(--navy);margin:0;line-height:1.5}
.law-num{font-size:.74rem;color:var(--ink3)}
.rel-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.rel-chip{font-size:.7rem;font-weight:700;color:var(--pd);background:#fff;border:1px solid rgba(0,174,198,.4);border-radius:999px;padding:1px 11px;text-decoration:none;transition:.15s}
.rel-chip:hover{background:var(--p);color:#fff}
.rel-chip.ext{color:var(--accent);border-color:rgba(178,62,89,.4)}
.rel-chip.ext:hover{background:var(--accent);color:#fff}

.art-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:20px 0 4px;padding:8px 0 6px;border-bottom:3px double var(--line2)}
.art-no{font-size:1.16rem;font-weight:900;color:var(--ink)}
.art-no::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--p);margin-right:8px;vertical-align:2px}
.art-cap{font-size:.86rem;color:var(--pd);font-weight:700}
.art-tools{margin-left:auto;display:flex;gap:6px}
.art-tools button{border:1px solid var(--line);background:#fff;border-radius:6px;width:27px;height:27px;font-size:.8rem;color:var(--ink3);display:flex;align-items:center;justify-content:center;transition:.15s}
.art-tools button:hover{border-color:var(--p);color:var(--pd)}
.art-tools button.on{color:var(--accent);border-color:var(--accent);background:var(--pink-soft)}

.node{display:flex;gap:9px;margin:8px 0;scroll-margin-top:96px;border-radius:8px;padding:2px 6px 2px 2px}
.node.hl{background:var(--yellow50);outline:2px solid var(--yellow)}
.node .badge{flex:0 0 auto;min-width:23px;height:23px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:7px;padding:0 4px}
.badge.p1{opacity:.35}
.node .body{font-size:.88rem;min-width:0;flex:1;text-align:justify}
.node.item{margin-left:26px}.node.item .badge{background:var(--p25);border-color:rgba(0,174,198,.3);color:var(--pd)}
.node.sub1{margin-left:56px}.node.sub1 .badge{background:var(--pink-soft);border-color:rgba(233,30,99,.25);color:var(--pink)}
.node.sub2{margin-left:86px}.node.sub2 .badge{background:var(--yellow50);border-color:#e2d49a;color:#8a6d1f}
.node.sub3{margin-left:116px}
.node-link{flex:0 0 auto;align-self:flex-start;margin-top:7px;opacity:0;font-size:.66rem;color:var(--ink3);text-decoration:none;transition:.15s}
.node:hover .node-link{opacity:1}
.node-link:hover{color:var(--pd)}

/* 括弧（Lawzillaの核） */
.kakko{color:#5b6a76}
.kakko-2{color:#8a6d1f}
.kakko-3{color:#7a5ba6}
.kakko-4{color:#b23e59}
.kakko-5{color:#2f7d52}
.kakko,.kakko-2,.kakko-3,.kakko-4,.kakko-5{cursor:pointer;border-radius:3px;transition:background .12s}
.kakko:hover,.kakko-2:hover,.kakko-3:hover,.kakko-4:hover,.kakko-5:hover{background:rgba(0,174,198,.08)}
.kfold{display:inline-block;background:var(--p25);color:var(--pd);font-weight:700;border-radius:4px;padding:0 6px;font-size:.78em;cursor:pointer;border:1px dashed rgba(0,129,147,.4)}
.kfold:hover{background:var(--p);color:#fff}

/* 参照リンク */
a.self{color:var(--pd);text-decoration:none;border-bottom:1.5px solid rgba(0,174,198,.55);cursor:pointer}
a.self:hover{background:var(--p25)}
a.law{color:#6a3fa0;text-decoration:none;border-bottom:1.5px dashed rgba(106,63,160,.45)}
a.law:hover{background:#f2ecfa}
a.law::after{content:"↗";font-size:.68em;vertical-align:super;margin-left:1px}

/* 表 */
.tbl-wrap{overflow-x:auto;margin:8px 0}
.law-tbl{border-collapse:collapse;font-size:.78rem;background:#fff}
.law-tbl td{border:1px solid var(--line2);padding:5px 9px;vertical-align:top;min-width:6em}

/* 被参照 */
.bk-sec{margin:18px 0 6px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.bk-sec .bk-h{background:var(--pink-soft);color:var(--accent);font-size:.74rem;font-weight:900;padding:4px 14px;letter-spacing:.04em}
.bk-sec .bk-b{padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px}
.bk-sec a{font-size:.72rem;font-weight:700;color:var(--accent);background:#fff;border:1px solid rgba(178,62,89,.35);border-radius:999px;padding:1px 10px;text-decoration:none;transition:.15s}
.bk-sec a:hover{background:var(--accent);color:#fff}
.bk-sec a.lawside{color:var(--pd);border-color:rgba(0,129,147,.35)}
.bk-sec a.lawside:hover{background:var(--pd);color:#fff}

/* メモ */
.memo{margin:14px 0;border:1px dashed var(--line2);border-radius:9px;padding:10px 14px;background:var(--yellow50)}
.memo .lbl{font-size:.66rem;font-weight:700;color:var(--ink3);letter-spacing:.14em}
.memo textarea{width:100%;min-height:52px;border:1px solid var(--line2);border-radius:7px;padding:7px 10px;font-family:var(--sans);font-size:.82rem;background:#fff;outline:none;resize:vertical}
.memo textarea:focus{border-color:var(--p)}

/* pager */
.pager{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0}
.pager a{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 16px;text-decoration:none;color:var(--navy);font-weight:700;font-size:.82rem;transition:.2s}
.pager a:hover{border-color:var(--p);background:var(--p25)}
.pager a.next{text-align:right}
.pager .dir{display:block;font-size:.62rem;font-weight:700;letter-spacing:.16em;color:var(--ink3)}

/* tooltip preview */
#tip{position:fixed;z-index:90;max-width:480px;background:#fff;border:1.5px solid var(--p);border-radius:10px;box-shadow:0 14px 40px -12px rgba(0,88,112,.4);padding:10px 14px;font-size:.78rem;line-height:1.85;display:none;pointer-events:none}
#tip .t-ka{font-weight:900;color:var(--navy);font-size:.76rem;margin-bottom:2px}
#tip .t-ka::before{content:"§ ";color:var(--p)}
#tip .t-b{color:var(--ink2);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}

/* search / home / notes */
.res-meta{font-size:.78rem;color:var(--ink2);margin:4px 0 12px}
.res{display:block;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 16px;margin-bottom:9px;text-decoration:none;color:inherit;transition:.2s}
.res:hover{border-color:var(--p);box-shadow:0 6px 18px -12px rgba(0,88,112,.3)}
.res .r-law{font-size:.66rem;font-weight:700;color:var(--pd);background:var(--p25);border-radius:4px;padding:1px 8px;margin-right:8px}
.res .r-t{font-weight:900;color:var(--navy);font-size:.88rem}
.res .r-s{font-size:.78rem;color:var(--ink2);margin-top:2px;line-height:1.8}
mark{background:var(--yellow);border-radius:2px;padding:0 1px}
.home-hero{background:linear-gradient(160deg,var(--navy),#00718e 55%,var(--pd));color:#fff;border-radius:12px;padding:30px 30px 26px;margin-bottom:18px}
.home-hero h1{font-size:1.5rem;font-weight:900;margin:0 0 6px;color:#fff}
.home-hero p{margin:0;font-size:.86rem;color:rgba(255,255,255,.85)}
.home-hero .em{color:#7eeaf8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.law-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px 14px;text-decoration:none;color:inherit;transition:.2s}
.law-card:hover{border-color:var(--p);box-shadow:0 8px 24px -12px rgba(0,88,112,.3);transform:translateY(-2px)}
.law-card h3{font-size:1rem;font-weight:900;color:var(--navy);margin:0 0 2px}
.law-card .num{font-size:.7rem;color:var(--ink3)}
.chip{font-size:.66rem;font-weight:700;background:var(--p25);color:var(--pd);border-radius:4px;padding:1px 8px;margin-top:8px;display:inline-block}
.note-foot{font-size:.72rem;color:var(--ink3);margin-top:26px;border-top:1px dashed var(--line2);padding-top:10px}
.empty{color:var(--ink3);font-size:.84rem;padding:26px 0;text-align:center}
.loading{color:var(--ink3);font-size:.84rem;padding:36px 0;text-align:center}

@media(max-width:1180px){.wrap{grid-template-columns:270px minmax(0,1fr)}.rail{display:none}}
@media(max-width:900px){
.wrap{grid-template-columns:1fr}
.side{position:fixed;left:0;top:84px;width:min(84vw,310px);background:#fff;z-index:25;transform:translateX(-105%);transition:transform .25s;box-shadow:8px 0 30px rgba(0,0,0,.12);height:calc(100vh - 84px)}
.side.open{transform:none}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:#fff;border-radius:7px;width:32px;height:32px;font-size:.95rem;color:var(--navy)}
.brand span.txt{display:none}
.lawsel{max-width:110px}
.content{padding:14px 12px 110px}
}
</style>
</head>
<body>
<nav class="topbar"><div class="topbar-in">
<button class="menu-btn" id="menuBtn">☰</button>
<a class="brand" href="#/"><span class="mark">法</span><span class="txt">CFC条文ブラウザ</span></a>
<select class="lawsel" id="lawSel"><option value="">法令を選択…</option></select>
<div class="searchbox"><span class="ic">🔎</span><input id="q" type="search" placeholder="検索（66の6 / 租税負担割合 / 第六十六条の六）"></div>
<button class="tb-btn" id="noteBtn">📒 ノート</button>
</div></nav>
<div class="ctlbar"><div class="ctlbar-in">
<span class="ctl-l">括弧</span>
<button class="kbtn" data-fold="0">全て展開</button>
<button class="kbtn" data-fold="2">二重以上を畳む</button>
<button class="kbtn" data-fold="1">全て畳む</button>
<span class="ctl-hint">括弧をクリックでも個別に畳める／〔…〕クリックで復元</span>
</div></div>

<div class="wrap">
<aside class="side" id="side"></aside>
<main class="content" id="main"><div class="loading">読み込み中…</div></main>
<aside class="rail" id="rail"></aside>
</div>
<div id="tip"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent||''};

const SLUG={hou:'cfc_hou',rei:'cfc_rei'};
const state={meta:[],laws:{},slug:null,notes:JSON.parse(localStorage.getItem('jp4notes')||'{}'),foldLv:0};
const saveNotes=()=>localStorage.setItem('jp4notes',JSON.stringify(state.notes));
const nk=(slug,id)=>slug+'/'+id;

async function loadMeta(){
  state.meta=await(await fetch('data2/meta.json')).json();
  const sel=$('#lawSel');
  state.meta.forEach(m=>{const o=document.createElement('option');o.value=m.slug;o.textContent=m.title;sel.appendChild(o)});
}
async function loadLaw(slug){
  if(state.laws[slug])return state.laws[slug];
  const d=await(await fetch('data2/'+slug+'.json')).json();
  d._artMap={};d.arts.forEach((a,i)=>d._artMap[a.id]={a,i});
  // 条→ノードアドレス列
  d._artNodes={};
  d.order.forEach(ad=>{const n=d.nodes[ad];(d._artNodes[n.art]=d._artNodes[n.art]||[]).push(ad)});
  state.laws[slug]=d;return d;
}

/* ---------- 描画 ---------- */
function nodeCls(t){return t==='Paragraph'?'para':t==='Item'?'item':t==='Subitem1'?'sub1':t==='Subitem2'?'sub2':'sub3'}
function badge(n,addr){
  if(n.t==='Paragraph'){const p=addr.split('.')[1];return '<span class="badge'+(p==='1'?' p1':'')+'">'+p+'</span>'}
  return '<span class="badge">'+esc(n.ti||'・')+'</span>';
}
function renderTbl(tbls){return (tbls||[]).map(rows=>'<div class="tbl-wrap"><table class="law-tbl">'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>').join('')}

function renderArticle(law,artId,hlAddr){
  const addrs=law._artNodes[artId]||[];
  const art=law.nodes['ln'+artId.replace(/_/g,'_')]; // Article node
  const a0=law._artMap[artId].a;
  const k=nk(law.slug,artId);
  const nt=state.notes[k]||{};
  let h='<div class="art-head"><span class="art-no" id="n_ln'+artId+'">'+esc(a0.label)+'</span>'+
    (a0.c?'<span class="art-cap">'+esc(a0.c)+'</span>':'')+
    '<span class="art-tools">'+
    '<button class="star'+(nt.star?' on':'')+'" data-k="'+esc(k)+'">'+(nt.star?'★':'☆')+'</button>'+
    '<button class="pen" data-k="'+esc(k)+'">✎</button></span></div>';
  for(const ad of addrs){
    const n=law.nodes[ad];
    if(n.t==='Article')continue;
    const hl=ad===hlAddr?' hl':'';
    h+='<div class="node '+nodeCls(n.t)+hl+'" id="n_'+ad.replace(/\./g,'-')+'">'+badge(n,ad)+
      '<div class="body">'+n.h+renderTbl(n.tbl)+'</div>'+
      '<a class="node-link" href="#/'+law.slug+'/n/'+ad+'" title="このノードへのリンク">¶</a></div>';
  }
  if(nt.memo)h+='<div class="memo"><div class="lbl">MY NOTE</div><textarea data-k="'+esc(k)+'">'+esc(nt.memo)+'</textarea></div>';
  // 被参照（条単位に集約）
  const bks=[];
  for(const ad of addrs){
    (law.backlinks[ad]||[]).forEach(b=>{
      if(!bks.some(x=>x.addr===b.addr&&x.law===b.law))bks.push(b);
    });
  }
  if(bks.length){
    h+='<div class="bk-sec"><div class="bk-h">⤴ この条を参照している規定（'+bks.length+'）</div><div class="bk-b">'+
      bks.map(b=>{
        const slug=SLUG[b.law];
        const cls=b.law==='hou'?'lawside':'';
        const tgt=b.addr.split('.')[0].slice(2);
        return '<a class="'+cls+'" href="#/'+slug+'/n/'+b.addr+'" data-prev="'+b.law+'@'+b.addr+'">'+esc(b.ka)+'</a>';
      }).join('')+'</div></div>';
  }
  return h;
}

function relChips(law){
  const other=law.key==='hou'?'cfc_rei':'cfc_hou';
  const otherT=law.key==='hou'?'施行令（抜粋）':'本法（抜粋）';
  return '<div class="rel-row">'+
    '<a class="rel-chip" href="#/'+other+'">'+otherT+'</a>'+
    '<a class="rel-chip ext" target="_blank" rel="noopener" href="https://lawzilla.jp/law/'+law.lawzilla+'">Lawzilla本体で開く ↗</a>'+
    '<a class="rel-chip ext" target="_blank" rel="noopener" href="https://laws.e-gov.go.jp/law/'+law.lawzilla+'">e-Gov ↗</a></div>';
}
function renderSide(law,curArt){
  if(!law){$('#side').innerHTML='';return}
  let h='';
  law.groups.forEach(g=>{
    h+='<div class="grp">'+esc(g.label)+'</div>';
    g.arts.forEach(id=>{
      const a=law._artMap[id].a;
      const k=nk(law.slug,id);
      const star=state.notes[k]&&state.notes[k].star?'<span class="star">★ </span>':'';
      h+='<a'+(id===curArt?' class="cur"':'')+' href="#/'+law.slug+'/a/'+id+'">'+star+esc(a.label)+
        (a.c?' <span class="cap">'+esc(a.c)+'</span>':'')+'</a>';
    });
  });
  $('#side').innerHTML=h;
}
function renderRail(law,artId){
  if(!law||!artId){$('#rail').innerHTML='';return}
  const addrs=(law._artNodes[artId]||[]).filter(ad=>{const n=law.nodes[ad];return n.t==='Paragraph'||n.t==='Item'});
  let h='<div class="r-h">⚡ 今すぐジャンプ</div><div class="r-b">';
  for(const ad of addrs){
    const n=law.nodes[ad];
    const lab=n.t==='Paragraph'?'第'+ad.split('.')[1]+'項':'　第'+esc(n.ti)+'号';
    h+='<a class="'+(n.t==='Item'?'lv2':'')+'" href="#/'+law.slug+'/n/'+ad+'">'+lab+' <span style="color:var(--ink3);font-size:.66rem">'+esc(strip(n.h).slice(0,14))+'…</span></a>';
  }
  h+='</div>';
  // 前後条
  const i=law._artMap[artId].i;
  h+='<div class="r-h bk">条の移動</div><div class="r-b">';
  if(i>0)h+='<a class="bk" href="#/'+law.slug+'/a/'+law.arts[i-1].id+'">← '+esc(law.arts[i-1].label)+'</a>';
  if(i<law.arts.length-1)h+='<a class="bk" href="#/'+law.slug+'/a/'+law.arts[i+1].id+'">→ '+esc(law.arts[i+1].label)+'</a>';
  h+='</div>';
  $('#rail').innerHTML=h;
}

/* ---------- views ---------- */
function crumb(parts){return '<div class="crumb">'+parts.map(p=>p.href?'<a href="'+p.href+'">'+esc(p.t)+'</a>':esc(p.t)).join(' › ')+'</div>'}
async function viewHome(){
  renderSide(null);renderRail(null);
  const cards=state.meta.map(m=>'<a class="law-card" href="#/'+m.slug+'"><h3>'+esc(m.title)+'</h3><div class="num">'+esc(m.num)+'</div><span class="chip">'+m.articles+'条</span></a>').join('');
  $('#main').innerHTML='<div class="home-hero"><h1>CFC税制 条文ブラウザ</h1><p>外国子会社合算税制の関連条文を、<span class="em">括弧の折りたたみ</span>・<span class="em">参照の自動リンク</span>・<span class="em">逆参照</span>付きで。</p></div>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="note-foot">出典: e-Gov法令検索（法令API）。CFC関連条文のみ抜粋（附則・別表省略）。参照リンクは機械解決のため、正確な解釈は原文を確認してください。条文ホバーで参照先プレビュー、（括弧）クリックで折りたたみ。</div>';
}
async function viewLaw(slug){
  const law=await loadLaw(slug);
  renderSide(law,null);renderRail(null);
  let h='<h1 class="law-title">'+esc(law.title)+'</h1><span class="law-num">'+esc(law.num)+'</span>'+relChips(law)+
    crumb([{t:'ホーム',href:'#/'},{t:law.title}]);
  law.groups.forEach(g=>{
    h+='<div class="grp" style="font-size:.8rem;font-weight:900;color:var(--navy);background:var(--p25);border-radius:6px;padding:4px 12px;margin:16px 0 8px">'+esc(g.label)+'</div>';
    g.arts.forEach(id=>{
      const a=law._artMap[id].a;
      h+='<a class="res" href="#/'+slug+'/a/'+id+'"><span class="r-t">'+esc(a.label)+'</span>'+
        (a.c?' <span class="r-s">'+esc(a.c)+'</span>':'')+'</a>';
    });
  });
  $('#main').innerHTML=h;window.scrollTo(0,0);
}
async function viewArticle(slug,artId,hlAddr){
  const law=await loadLaw(slug);
  if(!law._artMap[artId])return viewLaw(slug);
  renderSide(law,artId);renderRail(law,artId);
  const a=law._artMap[artId].a;
  const i=law._artMap[artId].i;
  let h='<h1 class="law-title" style="font-size:1.02rem">'+esc(law.title)+'</h1>'+relChips(law)+
    crumb([{t:'ホーム',href:'#/'},{t:law.title,href:'#/'+slug},{t:a.label}])+
    renderArticle(law,artId,hlAddr)+
    '<div class="pager">'+
    (i>0?'<a href="#/'+slug+'/a/'+law.arts[i-1].id+'"><span class="dir">← 前条</span>'+esc(law.arts[i-1].label)+' '+esc(law.arts[i-1].c||'')+'</a>':'')+
    (i<law.arts.length-1?'<a class="next" href="#/'+slug+'/a/'+law.arts[i+1].id+'"><span class="dir">次条 →</span>'+esc(law.arts[i+1].label)+' '+esc(law.arts[i+1].c||'')+'</a>':'')+
    '</div>';
  $('#main').innerHTML=h;
  bindTools();applyFold($('#main'),state.foldLv);
  if(hlAddr){
    const el=document.getElementById('n_'+hlAddr.replace(/\./g,'-'));
    if(el)setTimeout(()=>el.scrollIntoView({block:'center'}),60);
  }else window.scrollTo(0,0);
}
function artText(law,artId){
  const a=law._artMap[artId].a;
  return a.label+' '+(a.c||'')+' '+(law._artNodes[artId]||[]).map(ad=>{const n=law.nodes[ad];return (n.ti||'')+strip(n.h)}).join(' ');
}
function snippet(t,kw){
  const i=t.indexOf(kw);if(i<0)return esc(t.slice(0,90))+'…';
  const s=Math.max(0,i-40);
  return (s>0?'…':'')+esc(t.slice(s,i))+'<mark>'+esc(kw)+'</mark>'+esc(t.slice(i+kw.length,i+kw.length+55))+'…';
}
async function viewSearch(slug,kw){
  kw=decodeURIComponent(kw);
  const scopes=slug?[slug]:state.meta.map(m=>m.slug);
  $('#main').innerHTML='<div class="loading">「'+esc(kw)+'」を検索中…</div>';
  renderRail(null);
  const out=[];
  const num=kw.match(/^(\d+)(?:[の_-]\d+)*$/);
  for(const sl of scopes){
    const law=await loadLaw(sl);
    if(num){
      const id=kw.split(/[の_-]/).join('_');
      if(law._artMap[id])out.push({law,id,direct:true,snip:esc(law._artMap[id].a.c||'')});
    }
    for(const a of law.arts){
      const tx=artText(law,a.id);
      if(tx.includes(kw))out.push({law,id:a.id,snip:snippet(tx,kw)});
      if(out.length>160)break;
    }
  }
  if(slug){renderSide(state.laws[slug],null)}else{$('#side').innerHTML=''}
  const scopeName=slug?state.laws[slug].title:'全法令';
  $('#main').innerHTML='<h1 class="law-title" style="font-size:1.1rem">検索結果</h1>'+
    '<div class="res-meta">'+esc(scopeName)+' で「'+esc(kw)+'」: '+out.length+'件</div>'+
    (out.length?out.map(r=>'<a class="res" href="#/'+r.law.slug+'/a/'+r.id+'">'+
      '<span class="r-law">'+esc(r.law.key==='hou'?'法':'令')+'</span><span class="r-t">'+esc(r.law._artMap[r.id].a.label)+(r.law._artMap[r.id].a.c?'　'+esc(r.law._artMap[r.id].a.c):'')+'</span>'+
      '<div class="r-s">'+r.snip+'</div></a>').join(''):
    '<div class="empty">見つかりませんでした。条番号（例: 66の6）や別の語で試してください。</div>');
}
async function viewNotes(){
  renderSide(null);renderRail(null);
  const keys=Object.keys(state.notes).filter(k=>state.notes[k].star||state.notes[k].memo);
  if(!keys.length){$('#main').innerHTML='<h1 class="law-title">📒 法令ノート</h1><div class="empty">まだブックマーク・メモがありません。<br>条文見出し右の ☆ / ✎ から登録（このブラウザに保存）。</div>';return}
  let h='<h1 class="law-title">📒 法令ノート</h1><div class="res-meta">'+keys.length+'件（このブラウザに保存）</div>';
  for(const k of keys){
    const [sl,id]=k.split('/');
    const law=await loadLaw(sl);
    if(!law._artMap[id])continue;
    const nt=state.notes[k];const a=law._artMap[id].a;
    h+='<a class="res" href="#/'+sl+'/a/'+id+'"><span class="r-law">'+esc(law.key==='hou'?'法':'令')+'</span>'+
      (nt.star?'<span style="color:var(--accent)">★ </span>':'')+
      '<span class="r-t">'+esc(a.label)+(a.c?'　'+esc(a.c):'')+'</span>'+
      (nt.memo?'<div class="r-s">📝 '+esc(nt.memo).slice(0,140)+'</div>':'')+'</a>';
  }
  $('#main').innerHTML=h;
}

/* ---------- 括弧折りたたみ（Lawzillaの核機能） ---------- */
const foldStore=new WeakMap();
function foldEl(sp){
  if(foldStore.has(sp))return;
  const frag=document.createDocumentFragment();
  while(sp.firstChild)frag.appendChild(sp.firstChild);
  foldStore.set(sp,frag);
  sp.textContent='〔…〕';
  sp.classList.add('kfold');
}
function unfoldEl(sp){
  const frag=foldStore.get(sp);
  if(!frag)return;
  sp.textContent='';
  sp.appendChild(frag);
  foldStore.delete(sp);
  sp.classList.remove('kfold');
}
function kakkoLevel(sp){
  for(const c of sp.classList){if(c==='kakko')return 1;const m=c.match(/^kakko-(\d)/);if(m)return +m[1]}
  return 0;
}
function applyFold(root,lv){
  root.querySelectorAll('.kakko,.kakko-2,.kakko-3,.kakko-4,.kakko-5').forEach(sp=>{
    const l=kakkoLevel(sp);
    if(lv>0&&l>=lv)foldEl(sp);else unfoldEl(sp);
  });
}

/* ---------- ホバープレビュー ---------- */
const tip=$('#tip');
async function showTip(a,ev){
  const dl=a.dataset.link||a.dataset.prev;
  if(!dl)return;
  const [lk,addr]=dl.split('@');
  const law=await loadLaw(SLUG[lk]);
  let n=law.nodes[addr];
  if(!n&&addr.includes('.'))n=law.nodes[addr.split('.').slice(0,2).join('.')]||law.nodes[addr.split('.')[0]];
  if(!n)n=law.nodes[addr.split('.')[0]];
  if(!n)return;
  let body=strip(n.h);
  if(n.t==='Article'){ // 条ノードは本文が無いので第1項を出す
    const p1=law.nodes[addr.split('.')[0]+'.1'];
    if(p1)body=strip(p1.h);
  }
  tip.innerHTML='<div class="t-ka">'+esc((lk==='hou'?'法':'令')+n.ka)+(n.c?'　'+esc(n.c):'')+'</div><div class="t-b">'+esc(body.slice(0,360))+'</div>';
  tip.style.display='block';
  const x=Math.min(ev.clientX+14,innerWidth-500),y=Math.min(ev.clientY+16,innerHeight-200);
  tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px';
}
function hideTip(){tip.style.display='none'}

/* ---------- イベント ---------- */
function bindTools(){
  document.querySelectorAll('.art-tools .star').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    state.notes[k]=state.notes[k]||{};
    state.notes[k].star=!state.notes[k].star;
    if(!state.notes[k].star&&!state.notes[k].memo)delete state.notes[k];
    saveNotes();
    b.classList.toggle('on');b.textContent=b.classList.contains('on')?'★':'☆';
  }));
  document.querySelectorAll('.art-tools .pen').forEach(b=>b.addEventListener('click',()=>{
    let m=$('#main .memo');
    if(m){m.remove();return}
    const k=b.dataset.k;
    const nt=state.notes[k]||{};
    const d=document.createElement('div');d.className='memo';
    d.innerHTML='<div class="lbl">MY NOTE</div><textarea data-k="'+esc(k)+'" placeholder="この条文のメモ…">'+esc(nt.memo||'')+'</textarea>';
    const head=$('#main .art-head');
    head.parentNode.insertBefore(d,head.nextSibling);
    bindMemo(d.querySelector('textarea'));d.querySelector('textarea').focus();
  }));
  document.querySelectorAll('.memo textarea').forEach(bindMemo);
}
function bindMemo(ta){
  ta.addEventListener('input',()=>{
    const k=ta.dataset.k;
    state.notes[k]=state.notes[k]||{};
    state.notes[k].memo=ta.value;
    if(!ta.value&&!state.notes[k].star)delete state.notes[k];
    saveNotes();
  });
}

document.addEventListener('click',e=>{
  const self=e.target.closest('a.self');
  if(self){
    const [lk,addr]=self.dataset.link.split('@');
    const art=addr.slice(2).split('.')[0];
    location.hash='#/'+SLUG[lk]+'/n/'+addr;
    hideTip();
    return;
  }
  const kf=e.target.closest('.kfold');
  if(kf){unfoldEl(kf);e.stopPropagation();return}
  const kk=e.target.closest('.kakko,.kakko-2,.kakko-3,.kakko-4,.kakko-5');
  if(kk&&!e.target.closest('a')){foldEl(kk);e.stopPropagation()}
});
document.addEventListener('mouseover',e=>{
  const a=e.target.closest('a.self,[data-prev]');
  if(a)showTip(a,e);else hideTip();
});
document.addEventListener('scroll',hideTip,true);
document.querySelectorAll('.kbtn').forEach(b=>b.addEventListener('click',()=>{
  state.foldLv=+b.dataset.fold;
  document.querySelectorAll('.kbtn').forEach(x=>x.classList.toggle('on',x===b));
  applyFold($('#main'),state.foldLv);
}));

/* ---------- router ---------- */
async function route(){
  const seg=location.hash.replace(/^#\/?/,'').split('/');
  hideTip();
  try{
    if(!seg[0])await viewHome();
    else if(seg[0]==='notes')await viewNotes();
    else if(seg[1]==='a'){state.slug=seg[0];$('#lawSel').value=seg[0];await viewArticle(seg[0],seg[2])}
    else if(seg[1]==='n'){
      state.slug=seg[0];$('#lawSel').value=seg[0];
      const addr=seg[2];const art=addr.slice(2).split('.')[0];
      await viewArticle(seg[0],art,addr);
    }
    else if(seg[1]==='q'){state.slug=seg[0]==='all'?null:seg[0];await viewSearch(state.slug,seg.slice(2).join('/'))}
    else{state.slug=seg[0];$('#lawSel').value=seg[0];await viewLaw(seg[0])}
  }catch(err){$('#main').innerHTML='<div class="empty">読み込みエラー: '+esc(String(err))+'</div>'}
  $('#side').classList.remove('open');
}
(async()=>{
  await loadMeta();
  $('#lawSel').addEventListener('change',e=>{if(e.target.value)location.hash='#/'+e.target.value});
  $('#noteBtn').addEventListener('click',()=>location.hash='#/notes');
  $('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
  const q=$('#q');
  q.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&q.value.trim())location.hash='#/all/q/'+encodeURIComponent(q.value.trim());
  });
  addEventListener('hashchange',route);
  await route();
})();
</script>
